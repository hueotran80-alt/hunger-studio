name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-node-tests:
    name: Python, Node, P1 Hardening & CDN Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install "websockets>=14.0" pillow

      - name: Run Python backend & security tests
        run: |
          PYTHONPATH=.:tests python tests/test_cloud.py
          PYTHONPATH=.:tests python tests/test_security.py
          PYTHONPATH=.:tests python tests/test_server_concurrency.py
          PYTHONPATH=.:tests python tests/test_image_to_3d_provider.py
          PYTHONPATH=.:tests python tests/test_hunyuan_upload.py
          PYTHONPATH=.:tests python tests/test_robustness.py
          PYTHONPATH=.:tests python tests/test_blend_import.py
          PYTHONPATH=.:tests python test_agent_server.py

      - name: Run Node.js unit, P0/P1 hardening, skills & Beta Motion suites
        run: |
          node --import ./tests/three-resolve-hooks.mjs tests/test_asset_library.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_prefab_library.mjs
          node tests/test_cloud_client.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_embed_core.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_bvh_csg.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_deform_modifiers.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_shading_normals.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_bevel_true.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_catmull_clark.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_material_realism.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_video_export.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_pathtrace_environment.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_rust_render.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_sculpt_2.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_wave0_storage.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_wave1_interchange.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_wave2_surface.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_wave3_modeling.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_wave1_bleeding_fixes.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_wave2_fixes.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_wave3_fixes.mjs
          node tests/test_stem_voice_session.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_voice_wake_and_walkthrough.mjs
          node tests/test_scene_digest.mjs
          node tests/test_agent_tool_bridge.mjs
          node tests/test_copilot_guard.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_copilot_worker.mjs
          node tests/test_agent_exec_isolation.mjs
          node tests/test_cloudflare_worker.mjs
          node tests/test_parametric_cad.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_glb_optimizer.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_phase2_cad_budget.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_hunger_skills.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_procedural_contract.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_agent_shortcuts.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_p1_hardening.mjs
          node --import ./tests/three-resolve-hooks.mjs tests/test_beta_motion_telemetry.mjs

      - name: Build production & CDN dist/ + enforce commercial license policy
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/embed.html
          test -f dist/motion.html
          test ! -f dist/.DS_Store
          test -z "$(find dist -iname '*Michelle*' -o -iname '*Soldier*' -o -iname '*Church_Pew*' -o -iname '*Church_Environment*' -o -iname '*readyplayer*' -o -iname '*Congregation*' -o -iname '*test_brunette*' -o -iname '*Mary_Statue_159*' -o -iname '*Mary_Statue_NotreDame*' -o -iname '*UAL_Standard*')"
          over25m="$(find dist -type f -size +25M)"
          test -z "$over25m"
          npm run build:cdn
          test ! -d dist/models
          test ! -d dist/vendor/mediapipe

  rust-kernels:
    name: Rust WASM Kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test across all Rust kernels
        run: |
          for dir in crates/mesh_kernel crates/video_kernel crates/render_kernel crates/mocap_kernel; do
            echo "Testing $dir..."
            (cd "$dir" && cargo test --release)
          done

  browser-and-dist-gate:
    name: Headless Chromium Browser & Production Gate
    runs-on: ubuntu-latest
    needs: [python-and-node-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          pip install "websockets>=14.0" pillow

      - name: Run 14 Browser Suites + dist/ E2E Gate
        env:
          SUITE_TIMEOUT_SEC: "240"
          PATHTRACE_TIMEOUT_SEC: "900"
        run: |
          npm run test:browser
          npm run test:dist
