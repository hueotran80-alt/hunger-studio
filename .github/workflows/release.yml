name: Release Tag Deployment

on:
  push:
    tags:
      - "v*"

jobs:
  release-verify:
    name: Verify Release Tag & Package Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build CDN production bundle
        run: |
          npm ci
          npm run build:cdn
          test -f dist/index.html
          test -f dist/motion.html
          test -f dist/embed.html

      - name: Deploy production Worker (when CLOUDFLARE_API_TOKEN is configured)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STUDIO_R2_CDN: "1"
          HUNGER_ENV: "production"
        run: npx cf deploy -m production --tag "${GITHUB_REF_NAME}" --force
