<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Demo — Video render từ Web Blender Studio</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(120% 90% at 50% 0%, #1b2230 0%, #0b0e14 55%, #05070b 100%);
      color: #e8edf6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 32px 20px;
    }
    main { width: min(1080px, 100%); }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    h1 { font-size: clamp(18px, 2.2vw, 26px); font-weight: 650; letter-spacing: -0.01em; margin: 0; }
    .meta { color: #93a1b8; font-size: 13px; font-variant-numeric: tabular-nums; }
    .meta b { color: #cfd9e8; font-weight: 600; }
    .stage {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(140, 170, 220, 0.14);
    }
    video { display: block; width: 100%; height: auto; background: #000; }
    footer { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
    .badge {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(110, 168, 255, 0.35);
      color: #9fc3ff;
      background: rgba(110, 168, 255, 0.08);
    }
    .badge.green { border-color: rgba(46, 196, 182, 0.35); color: #6fe3d4; background: rgba(46, 196, 182, 0.08); }
    a.dl { margin-left: auto; color: #cfd9e8; font-size: 13px; text-decoration: none; border-bottom: 1px dashed rgba(207, 217, 232, 0.4); }
    a.dl:hover { color: #fff; border-bottom-color: #fff; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Studio Demo — dựng cảnh &amp; render ngay trong trình duyệt</h1>
      <div class="meta"><b>1280×720</b> · 30 fps · <b>90 frame</b> · 3,0 s · H.264 MP4 · GTAO + Bloom + Bokeh</div>
    </header>
    <div class="stage">
      <video id="demo" src="models/studio_demo.mp4" controls autoplay loop muted playsinline preload="auto"></video>
    </div>
    <footer>
      <span class="badge green">WebCodecs H.264</span>
      <span class="badge">GTAO · Bloom · Bokeh</span>
      <span class="badge">Rust WASM video kernel</span>
      <span class="badge">Timeline 0–89</span>
      <a class="dl" href="models/studio_demo.mp4" download>Tải MP4 ↓</a>
    </footer>
  </main>
</body>
</html>
