<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Web Blender Studio — Video Export Suite (Rust WASM + WebCodecs)</title>
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/three.module.js",
      "three/addons/": "../vendor/three/addons/",
      "mp4-muxer": "../vendor/mp4-muxer/mp4-muxer.mjs"
    }
  }
  </script>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; background:#141414; color:#e6e6e6; font:13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px 20px; }
    h1 { font-size:15px; margin:0 0 12px; }
    #summary { padding:3px 10px; border-radius:999px; background:#2a2a2a; border:1px solid #3d3d3d; }
    #summary.pass { background:#12351f; border-color:#2ecc71; color:#8ef0b0; }
    #summary.fail { background:#3a1414; border-color:#e74c3c; color:#ff9b90; }
    ol { list-style:none; padding:0; display:flex; flex-direction:column; gap:8px; }
    li { border:1px solid #2f2f2f; border-radius:6px; padding:9px 11px; background:#1b1b1b; }
    li.pass { border-color:#245c39; } li.fail { border-color:#7a2e2a; background:#221515; }
    .detail { color:#9aa0a6; margin-top:2px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Video Export Suite (Phase 5) <span id="summary">Đang chạy…</span></h1>
  <ol id="results"></ol>
  <div id="viewport-container" style="width:320px; height:240px; display:none;"></div>

  <script type="module">
    import * as THREE from 'three';
    import { initVideoKernel, flipYInPlace, rgbaToYuv420p, computeFrameHash } from '../js/render/video-kernel-bridge.js';
    import { VideoExportManager, VIDEO_BUDGET } from '../js/render/video-export.js';
    import { VideoEncoderClient } from '../js/render/video-encoder.js';
    import { FrameSource } from '../js/render/frame-source.js';

    const results = [];
    window.__VIDEO_EXPORT_RESULTS__ = results;
    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');

    async function test(name, fn) {
      const li = document.createElement('li');
      li.innerHTML = '<div class="name"></div><div class="detail"></div>';
      li.querySelector('.name').textContent = name;
      resultsEl.appendChild(li);
      const entry = { name, ok: false, detail: '' };
      results.push(entry);
      try {
        entry.detail = (await fn()) || '';
        entry.ok = true; li.className = 'pass';
      } catch (e) {
        entry.detail = String(e && e.stack || e); li.className = 'fail';
      }
      li.querySelector('.detail').textContent = entry.detail;
      const passed = results.filter(r => r.ok).length;
      summaryEl.textContent = `${passed}/${results.length} pass`;
      if (passed === results.length) summaryEl.className = 'pass';
      else summaryEl.className = 'fail';
    }

    // 1. Rust WASM Kernel Loading in Browser
    await test('Rust Video Kernel WASM: Tải và khởi tạo thành công trong trình duyệt', async () => {
      const ok = await initVideoKernel();
      if (!ok) throw new Error('Không thể nạp video_kernel.wasm');
      return 'Rust Video Kernel WASM sẵn sàng (23 KB)';
    });

    // 2. Rust In-place Line Flip
    await test('Rust Video Kernel: Lật dòng pixel Y in-place đạt chuẩn scanline video', () => {
      const buf = new Uint8Array([255, 0, 0, 255, 0, 0, 255, 255]);
      flipYInPlace(buf, 1, 2);
      if (buf[0] !== 0 || buf[2] !== 255 || buf[4] !== 255) throw new Error('Dòng pixel chưa được lật đúng');
      return 'Lật 2 dòng pixel 1x2 thành công trong Rust memory';
    });

    // 3. FrameSource & Off-screen WebGL Render Target
    await test('FrameSource: Khởi tạo render target và đọc pixel buffer ngoài màn hình', async () => {
      const container = document.getElementById('viewport-container');
      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setSize(320, 240);
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, 320 / 240, 0.1, 100);
      camera.position.z = 3;
      scene.add(new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0x3b82f6 })));

      const source = new FrameSource({
        renderer,
        scene,
        camera,
        width: 320,
        height: 240,
      });
      await source.init();

      const frame = source.captureFrame({ timestampUs: 0 });
      if (!frame.pixelBuffer || frame.pixelBuffer.length !== 320 * 240 * 4) {
        throw new Error('Pixel buffer không đúng kích thước 320x240x4');
      }

      source.dispose();
      renderer.dispose();
      container.removeChild(renderer.domElement);
      return `Chụp thành công frame 320x240 (Hash: 0x${frame.frameHash.toString(16)})`;
    });

    // 4. VideoEncoder & MP4 Muxer Encoding
    await test('VideoEncoderClient & mp4-muxer: Mã hoá H.264 và đóng gói MP4', async () => {
      const encoder = new VideoEncoderClient({
        width: 320,
        height: 240,
        fps: 30,
        format: 'mp4',
      });
      await encoder.init();

      const canvas = document.createElement('canvas');
      canvas.width = 320;
      canvas.height = 240;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(0, 0, 320, 240);
      await encoder.addFrame(canvas, 0, 0);

      const blob = await encoder.finalize();
      if (!blob || blob.type !== 'video/mp4') throw new Error('Không tạo được MP4 blob');
      return `Đã tạo blob MP4 (${blob.size} bytes)`;
    });

    // 5. Budget Validation
    await test('VideoExportManager: Ngăn chặn vượt tải ngân sách GPU/CPU', () => {
      const manager = new VideoExportManager();
      const b = manager.validateBudget({ width: 1280, height: 720, startFrame: 0, endFrame: 30 });
      if (b.totalFrames !== 31) throw new Error('Số frames tính toán không chính xác');
      return 'Xác thực ngân sách: 1280x720, 31 frames nằm trong hạn mức 1080p/1800f';
    });
  </script>
</body>
</html>
