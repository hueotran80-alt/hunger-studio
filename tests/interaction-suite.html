<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Web Blender Studio — Interaction Ownership Suite</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #141414; color: #e6e6e6; font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { padding: 16px 20px; border-bottom: 1px solid #2f2f2f; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 15px; margin: 0; font-weight: 600; }
    #summary { padding: 3px 10px; border-radius: 999px; background: #2a2a2a; border: 1px solid #3d3d3d; font-variant-numeric: tabular-nums; }
    #summary.pass { background: #12351f; border-color: #2ecc71; color: #8ef0b0; }
    #summary.fail { background: #3a1414; border-color: #e74c3c; color: #ff9b90; }
    main { display: grid; grid-template-columns: minmax(420px, 1fr) 900px; gap: 16px; padding: 16px 20px; align-items: start; }
    ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    li { border: 1px solid #2f2f2f; border-radius: 6px; padding: 9px 11px; background: #1b1b1b; }
    li.pass { border-color: #245c39; }
    li.fail { border-color: #7a2e2a; background: #221515; }
    li.running { border-color: #4a4a2a; }
    .name { font-weight: 600; }
    .detail { color: #9aa0a6; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
    .badge { float: right; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #2a2a2a; }
    li.pass .badge { background: #1d4d30; color: #8ef0b0; }
    li.fail .badge { background: #5a1f1c; color: #ffb4ab; }
    iframe { width: 900px; height: 560px; border: 1px solid #2f2f2f; border-radius: 6px; background: #000; }
    code { color: #8ab4f8; }
  </style>
</head>
<body>
  <header>
    <h1>Web Blender Studio — Interaction Ownership Suite</h1>
    <span id="summary">Đang chạy…</span>
    <span class="detail">Kiểm tra shortcut nào sở hữu phím nào, dialog/input có chặn nhầm không. Kết quả: <code>window.__INTERACTION_RESULTS__</code>.</span>
  </header>

  <main>
    <ol id="results"></ol>
    <iframe id="studio" src="/index.html" title="Web Blender Studio under test"></iframe>
  </main>

  <script type="module">
    const iframe = document.getElementById('studio');
    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const results = [];
    window.__INTERACTION_RESULTS__ = results;

    async function waitUntil(check, timeoutMs = 20000, label = 'condition') {
      const started = Date.now();
      while (Date.now() - started < timeoutMs) {
        try {
          if (await check()) return true;
        } catch (_) { /* frame not ready */ }
        await sleep(100);
      }
      throw new Error(`Timeout: ${label}`);
    }

    function frames(win, count = 2) {
      return new Promise((resolve) => {
        // Only used to let event handlers settle; a hidden tab pauses rAF, so
        // there is nothing to wait for.
        if (win.document.visibilityState === 'hidden') { resolve(); return; }
        let left = count;
        const step = () => {
          left -= 1;
          if (left <= 0) resolve();
          else win.requestAnimationFrame(step);
        };
        win.requestAnimationFrame(step);
      });
    }

    async function waitForStudio(win) {
      await waitUntil(
        () => win.app?.engine && win.sceneManager && win.studio && win.timelineUI && win.simulationManager,
        30000,
        'studio boot'
      );
    }

    function addItem(name) {
      const li = document.createElement('li');
      li.className = 'running';
      li.innerHTML = '<span class="badge">…</span><div class="name"></div><div class="detail"></div>';
      li.querySelector('.name').textContent = name;
      resultsEl.appendChild(li);
      return li;
    }

    function updateSummary() {
      const failed = results.filter((r) => r.status === 'fail').length;
      const passed = results.filter((r) => r.status === 'pass').length;
      summaryEl.textContent = `${passed} / ${results.length} PASS · ${failed} FAIL`;
      summaryEl.className = failed ? 'fail' : (passed === results.length ? 'pass' : '');
    }

    async function test(name, fn) {
      const item = addItem(name);
      const entry = { name, status: 'running', detail: '' };
      results.push(entry);
      try {
        const detail = await fn(iframe.contentWindow);
        entry.status = 'pass';
        entry.detail = typeof detail === 'string' ? detail : '';
        item.className = 'pass';
        item.querySelector('.badge').textContent = 'PASS';
      } catch (error) {
        entry.status = 'fail';
        entry.detail = error && error.stack ? error.stack : String(error);
        item.className = 'fail';
        item.querySelector('.badge').textContent = 'FAIL';
      }
      item.querySelector('.detail').textContent = entry.detail;
      updateSummary();
    }

    function press(win, key, code, options = {}) {
      const event = new win.KeyboardEvent('keydown', {
        key,
        code,
        bubbles: true,
        cancelable: true,
        ...options
      });
      (options.target || win.document.body).dispatchEvent(event);
      return event;
    }

    async function reset(win) {
      try { win.shareDialog?.close(); } catch (_) {}
      try { win.cloudPanel?.close(); } catch (_) {}
      try { win.modalTransform?.cancel(); } catch (_) {}
      try { if (win.editMode?.isActive) win.editMode.exit(); } catch (_) {}
      try { win.studio.clearScene(); } catch (_) {}
      await frames(win, 3);
      await sleep(100);
    }

    async function addCube(win, x = 0) {
      const cube = win.studio.addCube({ x, y: 1, z: 0, width: 1, height: 1, depth: 1, name: `Test${x}` });
      win.sceneManager.select(cube);
      await frames(win, 1);
      return cube;
    }

    await waitForStudio(iframe.contentWindow);

    await test('Dialog chặn Delete / G / Space / Arrow (không thao tác cảnh phía sau)', async (win) => {
      await reset(win);
      const cube = await addCube(win, 0);
      const before = cube.position.clone();
      win.timelineEngine.seekToFrame(10);
      const shareDialog = win.shareDialog || (await win.app._ensureShareDialog?.());
      shareDialog.open();
      await sleep(160);
      if (win.document.querySelector('.ss-backdrop')?.hidden) throw new Error('share dialog không mở');

      press(win, 'Delete', 'Delete');
      press(win, 'g', 'KeyG');
      press(win, ' ', 'Space');
      press(win, 'ArrowRight', 'ArrowRight');
      await sleep(80);

      if (!win.sceneManager.getAllObjects().includes(cube)) throw new Error('Delete xoá object sau dialog');
      if (!cube.position.equals(before)) throw new Error('G di chuyển object sau dialog');
      if (win.modalTransform?.isActive) throw new Error('modal transform chạy sau dialog');
      if (win.timelineEngine.isPlaying) throw new Error('Space phát timeline sau dialog');
      if (win.timelineEngine.currentFrame !== 10) throw new Error(`Arrow đổi frame sau dialog: ${win.timelineEngine.currentFrame}`);
      shareDialog.close();
      return 'Delete/G/Space/Arrow bị chặn đúng';
    });

    await test('Tab trên nút đang focus không bật Edit Mode; Tab ở viewport thì có', async (win) => {
      await reset(win);
      await addCube(win, 1);
      const btn = win.document.getElementById('tool-move');
      btn.focus();
      const blocked = press(win, 'Tab', 'Tab', { target: btn });
      if (win.editMode.isActive) throw new Error('Tab trên nút đã bật Edit Mode');
      if (blocked.defaultPrevented) throw new Error('Tab bị preventDefault khi đang điều hướng UI');

      win.document.activeElement?.blur();
      press(win, 'Tab', 'Tab');
      await sleep(80);
      if (!win.editMode.isActive) throw new Error('Tab ở viewport không bật Edit Mode');
      press(win, 'Tab', 'Tab');
      await sleep(80);
      if (win.editMode.isActive) throw new Error('Tab lần 2 không thoát Edit Mode');
      return 'UI navigation giữ Tab; viewport vẫn toggle Edit Mode';
    });

    await test('Đang gõ trong contenteditable không kích hoạt G/Delete/Space', async (win) => {
      await reset(win);
      const cube = await addCube(win, 2);
      const before = cube.position.clone();
      const span = win.document.createElement('span');
      span.contentEditable = 'true';
      span.tabIndex = 0;
      span.textContent = 'rename';
      win.document.body.appendChild(span);
      span.focus();

      press(win, 'g', 'KeyG', { target: span });
      press(win, 'Delete', 'Delete', { target: span });
      press(win, ' ', 'Space', { target: span });
      await sleep(80);
      span.remove();

      if (win.sceneManager.getAllObjects().length !== 1) throw new Error('Delete xoá object khi đang gõ');
      if (!cube.position.equals(before)) throw new Error('G chạy khi đang gõ');
      if (win.modalTransform?.isActive) throw new Error('modal transform chạy khi đang gõ');
      if (win.timelineEngine.isPlaying) throw new Error('Space phát timeline khi đang gõ');
      return 'contenteditable sở hữu phím đúng';
    });

    await test('Code editor sở hữu Space và Ctrl+Z (không xoá object)', async (win) => {
      await reset(win);
      const cube = await addCube(win, 3);
      const area = win.document.getElementById('script-code-area');
      area.focus();
      press(win, ' ', 'Space', { target: area });
      press(win, 'z', 'KeyZ', { target: area, ctrlKey: true });
      await sleep(80);
      if (win.timelineEngine.isPlaying) throw new Error('Space trong editor phát timeline');
      if (!win.sceneManager.getAllObjects().includes(cube)) throw new Error('Ctrl+Z trong editor đã undo scene');
      area.blur();
      return 'textarea giữ Space/Ctrl+Z';
    });

    await test('Keyframe picker sở hữu 1-6/Enter/Escape và chặn Space', async (win) => {
      await reset(win);
      const cube = await addCube(win, 4);
      win.timelineUI._showInsertModal();
      const modal = win.document.getElementById('tl-kf-modal');
      if (!modal.classList.contains('is-open')) throw new Error('picker không mở');

      press(win, ' ', 'Space');
      await sleep(60);
      if (win.timelineEngine.isPlaying) throw new Error('Space phát timeline khi picker mở');
      if (!modal.classList.contains('is-open')) throw new Error('Space đóng nhầm picker');

      press(win, '2', 'Digit2');
      await sleep(80);
      if (modal.classList.contains('is-open')) throw new Error('phím 2 không chọn Rotation/đóng picker');
      if (!win.timelineEngine.hasKeyframe(cube, Math.round(win.timelineEngine.currentFrame))) {
        throw new Error('phím 2 không tạo keyframe rotation');
      }
      return 'Space bị chặn; phím 2 tạo keyframe và đóng picker';
    });

    await test('Numpad 1 đổi view; Digit 1 không đổi view', async (win) => {
      await reset(win);
      const original = win.engine.setCameraPreset;
      const calls = [];
      win.engine.setCameraPreset = (preset) => { calls.push(preset); };
      try {
        press(win, '1', 'Digit1');
        if (calls.length) throw new Error(`Digit1 gọi camera preset: ${calls.join(',')}`);
        press(win, '1', 'Numpad1');
        if (calls.join(',') !== 'front') throw new Error(`Numpad1 gọi: ${calls.join(',') || 'không'}`);
      } finally {
        win.engine.setCameraPreset = original;
      }
      return 'Numpad và hàng số tách đúng';
    });

    await test('Multi-select: Shift+D và menu Duplicate cùng nhân bản 2 object, 1 undo xoá cả 2', async (win) => {
      await reset(win);
      const a = await addCube(win, 5);
      const b = await addCube(win, 8);
      win.sceneManager.setSelection([a, b]);
      press(win, 'D', 'KeyD', { shiftKey: true });
      await sleep(120);
      if (win.sceneManager.getAllObjects().length !== 4) {
        throw new Error(`Shift+D tạo ${win.sceneManager.getAllObjects().length}/4 object`);
      }
      win.sceneManager.undo();
      await sleep(80);
      if (win.sceneManager.getAllObjects().length !== 2) throw new Error('1 undo không xoá đủ 2 bản sao');

      win.sceneManager.setSelection([a, b]);
      win.document.getElementById('btn-edit-duplicate').click();
      await sleep(120);
      if (win.sceneManager.getAllObjects().length !== 4) throw new Error('menu Duplicate không nhân bản đủ 2');
      return '2 object → 4 → undo → 2';
    });

    await test('Menu Group/Ungroup hoạt động và undo khôi phục hierarchy', async (win) => {
      await reset(win);
      const a = await addCube(win, 11);
      const b = await addCube(win, 14);
      win.sceneManager.setSelection([a, b]);
      win.document.getElementById('btn-edit-group').click();
      await sleep(80);
      const group = win.sceneManager.getAllObjects().find((o) => o.isGroup);
      if (!group || group.children.length !== 2) throw new Error('menu Group không tạo group 2 con');

      win.sceneManager.undo();
      await sleep(80);
      if (win.sceneManager.getAllObjects().length !== 2) throw new Error('undo Group không trả 2 object');
      if (a.parent === group) throw new Error('undo Group vẫn gắn con vào group đã gỡ');

      win.sceneManager.redo();
      await sleep(80);
      win.sceneManager.setSelection([group]);
      win.document.getElementById('btn-edit-ungroup').click();
      await sleep(80);
      if (win.sceneManager.getAllObjects().length !== 2) throw new Error('menu Ungroup không trả 2 object');

      win.sceneManager.setSelection([a, b]);
      press(win, 'g', 'KeyG', { ctrlKey: true });
      await sleep(80);
      const keyedGroup = win.sceneManager.getAllObjects().find((o) => o.isGroup && o.children.length === 2);
      if (!keyedGroup) throw new Error('Ctrl+G không tạo group từ vùng chọn');
      return 'Group → undo → redo → Ungroup → Ctrl+G đúng';
    });

    await test('Modal G/R/S sở hữu phím: Delete/Tab/Ctrl+Z/Numpad không lọt xuống cảnh', async (win) => {
      await reset(win);
      const cube = await addCube(win, 20);
      const before = cube.position.clone();
      const started = win.app.modalTransform.start('translate');
      if (!started) throw new Error('không khởi động được modal transform');
      const originalToggle = win.cameraManager.toggleViewCamera;
      let cameraToggles = 0;
      win.cameraManager.toggleViewCamera = () => { cameraToggles += 1; };

      press(win, 'Delete', 'Delete');
      press(win, 'Tab', 'Tab');
      press(win, 'z', 'KeyZ', { ctrlKey: true });
      if (win.app.modalTransform.axisLock === 'Z') {
        throw new Error('Ctrl+Z bị modal hiểu thành khóa trục Z');
      }
      press(win, 'f', 'KeyF');
      press(win, '0', 'Numpad0');
      await sleep(80);
      win.cameraManager.toggleViewCamera = originalToggle;

      if (!win.sceneManager.getAllObjects().includes(cube)) throw new Error('Delete xoá object giữa modal transform');
      if (win.editMode.isActive) throw new Error('Tab bật Edit Mode giữa modal transform');
      if (!cube.position.equals(before)) throw new Error('Ctrl+Z/F làm đổi vị trí giữa modal transform');
      if (cameraToggles !== 0) throw new Error('Numpad0 đổi camera giữa modal transform');
      if (!win.app.modalTransform.isActive) throw new Error('modal transform bị huỷ bởi phím khác');

      press(win, 'Escape', 'Escape');
      await sleep(80);
      if (win.app.modalTransform.isActive) throw new Error('Escape không huỷ modal transform');
      return 'Delete/Tab/Ctrl+Z/Numpad bị chặn; Escape đóng đúng';
    });

    await test('Shift+F12 và menu Viewport Render gọi render; nhãn không còn F12 trần', async (win) => {
      await reset(win);
      await addCube(win, 17);
      const original = win.app.exporter.captureRenderPNG;
      let calls = 0;
      win.app.exporter.captureRenderPNG = () => { calls += 1; };
      try {
        press(win, 'F12', 'F12', { shiftKey: true });
        win.document.getElementById('btn-render-viewport').click();
        if (calls !== 2) throw new Error(`render được gọi ${calls}/2 lần`);
      } finally {
        win.app.exporter.captureRenderPNG = original;
      }
      const label = win.document.querySelector('#btn-render-viewport .shortcut')?.textContent || '';
      if (!/Shift\+F12/.test(label)) throw new Error(`nhãn render vẫn là: ${label}`);
      return 'Shift+F12 + menu render → 2 lần gọi';
    });

    await test('Help → About mở hộp thoại non-blocking (không dùng window.alert)', async (win) => {
      await reset(win);
      const original = win.alert;
      let alertCalled = false;
      win.alert = () => { alertCalled = true; };
      let text = '';
      try {
        win.document.getElementById('btn-help-about').click();
        const modal = win.document.getElementById('wbs-info-dialog-backdrop');
        text = modal?.textContent || '';
        modal?.querySelector('button')?.click();
        if (win.document.getElementById('wbs-info-dialog-backdrop')) {
          throw new Error('Close button không đóng được hộp thoại About');
        }
      } finally {
        win.alert = original;
      }
      if (alertCalled) throw new Error('About vẫn gọi window.alert() đồng bộ');
      if (!text.includes('Hunger')) throw new Error('About không hiện nội dung');
      return text.split('\n')[0].trim().slice(0, 48);
    });

    await test('Cmd/Ctrl+Shift+R không bị app chặn (vẫn reload được)', async (win) => {
      await reset(win);
      await addCube(win, 21);
      const metaR = press(win, 'R', 'KeyR', { metaKey: true, shiftKey: true });
      const ctrlR = press(win, 'R', 'KeyR', { ctrlKey: true, shiftKey: true });
      if (metaR.defaultPrevented || ctrlR.defaultPrevented) {
        throw new Error('app preventDefault Cmd/Ctrl+Shift+R');
      }
      if (win.app.modalTransform.isActive) throw new Error('Cmd+Shift+R mở modal Rotate');
      return 'không chặn reload; không mở Rotate';
    });

    await test('Edit Mode: Shift+A mở Add menu, không Select All; A mới Select All', async (win) => {
      await reset(win);
      await addCube(win, 22);
      win.engine.toggleEditMode();
      await sleep(120);
      if (!win.editMode.isActive) throw new Error('không vào được Edit Mode');
      const original = win.editMode.toggleSelectAll;
      let calls = 0;
      win.editMode.toggleSelectAll = () => { calls += 1; };
      try {
        press(win, 'A', 'KeyA', { shiftKey: true });
        await sleep(40);
        if (calls !== 0) throw new Error('Shift+A gọi Select All trong Edit Mode');
        press(win, 'a', 'KeyA');
        await sleep(40);
        if (calls !== 1) throw new Error('A không gọi Select All trong Edit Mode');
      } finally {
        win.editMode.toggleSelectAll = original;
        win.document.getElementById('menu-add')?.classList.remove('open');
        win.engine.toggleEditMode();
      }
      return 'Shift+A ≠ Select All; A = Select All';
    });

    await test('Ctrl+G cần ≥2 object; 1 object không tạo group', async (win) => {
      await reset(win);
      await addCube(win, 23);
      press(win, 'g', 'KeyG', { ctrlKey: true });
      await sleep(80);
      if (win.sceneManager.getAllObjects().some((o) => o.isGroup)) {
        throw new Error('Ctrl+G tạo group chỉ với 1 object');
      }
      return '1 object bị từ chối';
    });

    await test('Click chọn nhiều object bằng Shift và Cmd/Ctrl', async (win) => {
      await reset(win);
      const a = win.studio.addCube({ x: -2, y: 1, z: 0, name: 'PickA' });
      const b = win.studio.addCube({ x: 2, y: 1, z: 0, name: 'PickB' });
      win.sceneManager.select(a);
      const cam = win.engine.camera;
      const canvas = win.engine.domElement;
      const rect = canvas.getBoundingClientRect();
      const screen = (obj) => {
        const v = obj.position.clone();
        v.y += 1;
        v.project(cam);
        return { x: rect.left + (v.x + 1) / 2 * rect.width, y: rect.top + (-v.y + 1) / 2 * rect.height };
      };
      const click = (obj, modifiers = {}) => {
        const p = screen(obj);
        canvas.dispatchEvent(new win.PointerEvent('pointerdown', {
          clientX: p.x, clientY: p.y, bubbles: true, cancelable: true,
          pointerId: 1, pointerType: 'mouse', button: 0, buttons: 1, ...modifiers
        }));
        canvas.dispatchEvent(new win.PointerEvent('pointerup', {
          clientX: p.x, clientY: p.y, bubbles: true, cancelable: true,
          pointerId: 1, pointerType: 'mouse', button: 0, ...modifiers
        }));
      };
      click(b, { shiftKey: true });
      await sleep(40);
      if (win.sceneManager.getSelectedObjects().length !== 2) throw new Error('Shift+click không thêm object thứ 2');
      click(b, { metaKey: true });
      await sleep(40);
      if (win.sceneManager.getSelectedObjects().length !== 1) throw new Error('Cmd+click không bỏ chọn object thứ 2');
      click(b, { ctrlKey: true });
      await sleep(40);
      if (win.sceneManager.getSelectedObjects().length !== 2) throw new Error('Ctrl+click không thêm lại object thứ 2');
      return 'Shift/Cmd/Ctrl+click chọn & bỏ chọn đúng';
    });

    await test('Phím 0 và Numpad 0 cùng vào/ra camera view', async (win) => {
      await reset(win);
      win.cameraManager.createCamera({ name: 'TestCam', position: { x: 6, y: 4, z: 8 }, target: { x: 0, y: 1, z: 0 } });
      press(win, '0', 'Digit0');
      await sleep(80);
      if (!win.cameraManager.lookingThrough) throw new Error('phím 0 không vào camera view');
      press(win, '0', 'Numpad0');
      await sleep(80);
      if (win.cameraManager.lookingThrough) throw new Error('Numpad0 không thoát camera view');
      return '0 / Numpad0 toggle đúng';
    });

    await test('Edit Mode: Ctrl+Z xoá object thì thoát Edit Mode và dọn khung', async (win) => {
      await reset(win);
      const cube = await addCube(win, 24);
      win.sceneManager.select(cube);
      win.engine.toggleEditMode();
      await sleep(120);
      if (!win.editMode.isActive) throw new Error('không vào được Edit Mode');
      if (!win.editMode.helperGroup.parent) throw new Error('khung Edit Mode không xuất hiện');

      press(win, 'z', 'KeyZ', { ctrlKey: true });
      await sleep(180);
      if (win.editMode.isActive) throw new Error('Undo xoá object nhưng vẫn ở Edit Mode');
      if (win.editMode.helperGroup.parent) throw new Error('khung Edit Mode còn sót lại');
      if (win.sceneManager.getAllObjects().length !== 0) throw new Error('Undo không xoá object');
      if (win.document.getElementById('viewport-mode')?.value !== 'object') {
        throw new Error('UI vẫn hiển thị Edit Mode');
      }

      press(win, 'y', 'KeyY', { ctrlKey: true });
      await sleep(180);
      if (win.sceneManager.getAllObjects().length !== 1) throw new Error('Redo không khôi phục object');
      if (win.editMode.isActive) throw new Error('Redo tự bật lại Edit Mode');
      return 'Undo xoá object → thoát Edit Mode sạch; Redo khôi phục';
    });

    await test('Edit Mode: Ctrl+Z khôi phục hình học, giữ nguyên khung', async (win) => {
      await reset(win);
      const cube = await addCube(win, 25);

        if (!uniqueIds(tempContainer)) throw new Error('panel tạm có id DOM trùng');
        if (!tempContainer.innerHTML.trim()) throw new Error('panel tạm không render');
        const after = events.map((e) => sm._listeners.get(e)?.size || 0);
        if (after.some((n, i) => n !== before[i] + 1)) throw new Error('panel tạm không đăng ký callback');
        const rafHandle = tempPanel._angleRaf;
        if (rafHandle == null) throw new Error('panel tạm không schedule rAF góc');
        const cancelled = [];
        originalCancel = win.cancelAnimationFrame;

        tempPanel.dispose();
        if (!cancelled.includes(rafHandle)) throw new Error('dispose không cancel rAF góc');
        if (tempPanel._angleRaf !== null || tempContainer.innerHTML !== '') throw new Error('dispose không dọn rAF/DOM');
        const restored = events.map((e) => sm._listeners.get(e)?.size || 0);
        if (restored.some((n, i) => n !== before[i])) throw new Error('dispose để lại callback');
        sm.emit('selectionChanged', { selected: [ra], active: ra });
        sm.emit('historyChanged', { canUndo: true, canRedo: false, lastAction: 'probe' });
        if (tempContainer.innerHTML !== '') throw new Error('callback sau dispose resurrect DOM');
        tempPanel = null;
        return 'exporter roundtrip · duplicate độc lập · Bake 21 keyframe · selection/DOM/phím · dispose sạch';
      } finally {
        if (originalCancel) { win.cancelAnimationFrame = originalCancel; originalCancel = null; }
        try { tempPanel?.dispose(); } catch (_) {}
        tempContainer?.remove();
        sim.pause();
        sim.setGravity(savedGravity.x, savedGravity.y, savedGravity.z);
        sim.setGroundEnabled(savedGround, savedGroundY);
        sim.reset();
        panel.refresh();
      }
    });

    // Camera regressions use live Three.js cameras, controls, geometry and DOM events.
    function near(actual, expected, label, tolerance = 1e-6) {
      if (!Number.isFinite(actual) || Math.abs(actual - expected) > tolerance) {
        throw new Error(`${label}: ${actual} != ${expected}`);
      }
    }

    function viewState(engine) {
      return {
        camera: engine.camera,
        position: engine.camera.position.clone(),
        quaternion: engine.camera.quaternion.clone(),
        target: engine.controls.target.clone(),
        zoom: engine.camera.zoom,
        projection: engine.camera.projectionMatrix.clone()
      };
    }

    function unchangedView(engine, before, label) {
      if (engine.camera !== before.camera) throw new Error(`${label}: đổi camera`);
      near(engine.camera.position.distanceTo(before.position), 0, `${label}: position`);
      near(engine.camera.quaternion.angleTo(before.quaternion), 0, `${label}: quaternion`);
      near(engine.controls.target.distanceTo(before.target), 0, `${label}: target`);
      near(engine.camera.zoom, before.zoom, `${label}: zoom`);
      engine.camera.projectionMatrix.elements.forEach((value, i) => {
        near(value, before.projection.elements[i], `${label}: projection[${i}]`);
      });
    }

    function testView(win, orthographic = false) {
      const engine = win.app.engine;
      win.cameraManager.exitCameraView();
      if (engine.camera.isOrthographicCamera) engine.toggleProjection();
      engine.controls.target.set(0, 1, 0);
      engine.camera.position.set(8, 6, 10);
      engine.camera.zoom = 1;
      engine.camera.lookAt(engine.controls.target);
      engine.camera.updateProjectionMatrix();
      engine.controls.update();
      if (orthographic) engine.toggleProjection();
      engine._render();
    }

    async function withCamera(win, run) {
      await reset(win);
      win.sculptMode?.exit();
      win.cameraManager.exitCameraView();
      win.document.activeElement?.blur();
      const engine = win.app.engine;
      const originalCamera = engine.camera;
      const copies = [engine.perspectiveCamera, engine.orthographicCamera].map((camera) => [camera, camera.clone()]);
      const target = engine.controls.target.clone();
      const { enabled, enableDamping, autoRotate } = engine.controls;
      const gizmoEnabled = engine.transformControls.enabled;
      const transformMode = engine.currentTransformMode;
      try {
        engine.controls.enableDamping = false;
        engine.controls.autoRotate = false;
        engine.controls.enabled = true;
        engine.controls.update(); // Drain any OrbitControls deltas from earlier pointer tests.
        testView(win);
        return await run(engine);
      } finally {
        win.app.modalTransform?.cancel();
        win.shareDialog?.close();
        if (win.editMode.isActive) win.editMode.exit();
        win.cameraManager.exitCameraView();
        win.document.activeElement?.blur();
        if (engine.camera !== originalCamera) engine.toggleProjection();
        copies.forEach(([camera, copy]) => camera.copy(copy, false));
        engine.controls.target.copy(target);
        engine.controls.update();
        engine.controls.enabled = enabled;
        engine.controls.enableDamping = enableDamping;
        engine.controls.autoRotate = autoRotate;
        engine.transformControls.enabled = gizmoEnabled;
        engine.setTransformMode(transformMode);
        engine.onResize();
        engine._render();
      }
    }

    function editWorldPoints(win, indices) {
      // Independent local -> world oracle; do not use focusSelection's vertex-index helper.
      return indices.map((index) => {
        const point = win.editMode.vertices[index].clone();
        for (let node = win.editMode.targetMesh; node; node = node.parent) {
          point.multiply(node.scale).applyQuaternion(node.quaternion).add(node.position);
        }
        return point;
      });
    }

    function assertFramed(win, points, label) {
      const engine = win.app.engine;
      const center = new win.THREE.Box3().setFromPoints(points).getCenter(new win.THREE.Vector3());
      near(engine.controls.target.distanceTo(center), 0, `${label}: world bounds center`);
      engine._render();
      for (const point of points) {
        const ndc = point.clone().project(engine.camera);
        if (![ndc.x, ndc.y, ndc.z].every(Number.isFinite) || Math.max(Math.abs(ndc.x), Math.abs(ndc.y), Math.abs(ndc.z)) > 1.000001) {
          throw new Error(`${label}: selected point nằm ngoài frustum: ${ndc.toArray()}`);
        }
      }
    }

    function viewHalfHeight(engine) {
      const camera = engine.camera;
      return camera.isOrthographicCamera
        ? (camera.top - camera.bottom) / (2 * camera.zoom)
        : camera.position.distanceTo(engine.controls.target) * Math.tan(camera.getEffectiveFOV() * Math.PI / 360);
    }

    await test('Projection: roundtrip giữ target/quaternion và scale trên target plane', (win) => withCamera(win, async (engine) => {
      await addCube(win);
      engine.perspectiveCamera.zoom = 1.35; // Exercise effective FOV, not just camera.fov.
      engine.perspectiveCamera.updateProjectionMatrix();
      engine._render();
      const original = viewState(engine);
      const distance = engine.camera.position.distanceTo(original.target);
      const tangent = Math.tan(engine.camera.getEffectiveFOV() * Math.PI / 360);
      const right = new win.THREE.Vector3(1, 0, 0).applyQuaternion(original.quaternion);
      const up = new win.THREE.Vector3(0, 1, 0).applyQuaternion(original.quaternion);
      const forward = engine.camera.getWorldDirection(new win.THREE.Vector3());
      const probe = original.target.clone().add(right).addScaledVector(up, 0.5);
      const deeper = probe.clone().addScaledVector(forward, distance);
      const expectedX = 1 / (distance * tangent * engine.perspectiveCamera.aspect);
      const expectedY = 0.5 / (distance * tangent);
      const pixelWidth = engine.domElement.getBoundingClientRect().width;
      const perspectiveProbe = probe.clone().project(engine.camera);
      near(perspectiveProbe.x, expectedX, 'perspective NDC x');
      near(perspectiveProbe.y, expectedY, 'perspective NDC y');
      near(deeper.clone().project(engine.camera).x, expectedX / 2, 'perspective depth falloff');
      for (let round = 0; round < 3; round += 1) {
        engine.toggleProjection();
        engine._render();
        if (engine.camera !== engine.orthographicCamera || !engine.camera.isOrthographicCamera) throw new Error('không dùng OrthographicCamera thật');
        near(engine.controls.target.distanceTo(original.target), 0, 'ortho target');
        near(engine.camera.quaternion.angleTo(original.quaternion), 0, 'ortho quaternion');
        const projected = probe.clone().project(engine.camera);
        near(projected.x, expectedX, 'ortho NDC x');
        near(projected.y, expectedY, 'ortho NDC y');
        near(projected.x * pixelWidth / 2, perspectiveProbe.x * pixelWidth / 2, 'rendered pixel scale');
        near(deeper.clone().project(engine.camera).x, expectedX, 'ortho không perspective foreshortening');
        near(engine.camera.projectionMatrix.elements[15], 1, 'ortho homogeneous projection');
        engine.toggleProjection();
        engine._render();
        unchangedView(engine, original, `roundtrip ${round + 1}`);
      }
      engine.toggleProjection();
      engine.camera.near = 0;
      engine.camera.far = 0.05;
      engine.camera.updateProjectionMatrix();
      engine.toggleProjection();
      if (!(engine.camera.near > 0 && engine.camera.near < engine.camera.far) || !engine.camera.projectionMatrixInverse.elements.every(Number.isFinite)) throw new Error('ortho near=0 làm hỏng perspective');
      return '3 roundtrip · effective FOV · NDC/pixel scale · depth invariance · near=0';
    }));

          engine.onResize();

          const h = engine.container.clientHeight;
          near(w, width, 'temporary container width', 1);
          near(h, height, 'temporary container height', 1);
          const aspect = w / h;
          near(engine.perspectiveCamera.aspect, aspect, 'inactive perspective aspect');
          near(engine.perspectiveCamera.projectionMatrix.elements[5] / engine.perspectiveCamera.projectionMatrix.elements[0], aspect, 'perspective matrix aspect');
          near((camera.right - camera.left) / (camera.top - camera.bottom), aspect, 'ortho frustum aspect');
          near(camera.projectionMatrix.elements[5] / camera.projectionMatrix.elements[0], aspect, 'ortho matrix aspect');
          near(camera.zoom, zoom, 'resize giữ zoom');
          near((camera.top - camera.bottom) / (2 * camera.zoom), span, 'resize giữ vertical scale');
          const rendererSize = engine.renderer.getSize(new win.THREE.Vector2());
          near(rendererSize.x, w, 'renderer width');
          near(rendererSize.y, h, 'renderer height');
          if (sceneView) near(engine.camera.aspect, aspect, 'active scene camera aspect');

      } finally {

    await test('Orthographic: raycast click/Shift-click và pointer G transform + undo/redo thật', (win) => withCamera(win, async (engine) => {
      const a = await addCube(win, -2);
      const b = await addCube(win, 2);
      testView(win, true);
      engine.setCameraPreset('front');
      engine._render();
      win.sceneManager.clearSelection();
      const canvas = engine.domElement;
      const click = (object, modifiers = {}) => {
        engine._render();
        const rect = canvas.getBoundingClientRect();
        const point = new win.THREE.Box3().setFromObject(object).getCenter(new win.THREE.Vector3()).project(engine.camera);
        if (Math.abs(point.x) >= 0.8 || Math.abs(point.y) >= 0.8) throw new Error('pick fixture ngoài vùng viewport an toàn');
        const coordinates = { clientX: rect.left + (point.x + 1) * rect.width / 2, clientY: rect.top + (1 - point.y) * rect.height / 2, bubbles: true, cancelable: true, pointerId: 41, pointerType: 'mouse', button: 0, ...modifiers };
        // Synthetic DOM pointers cannot acquire native pointer capture. Disable only
        // orbit/gizmo gestures while dispatching; Engine's real picking still runs.
        const orbitEnabled = engine.controls.enabled;
        const gizmoEnabled = engine.transformControls.enabled;
        try {
          engine.controls.enabled = false;
          engine.transformControls.enabled = false;
          canvas.dispatchEvent(new win.PointerEvent('pointerdown', { ...coordinates, buttons: 1 }));
          canvas.dispatchEvent(new win.PointerEvent('pointerup', { ...coordinates, buttons: 0 }));
        } finally {
          engine.controls.enabled = orbitEnabled;
          engine.transformControls.enabled = gizmoEnabled;
        }
      };
      click(a);
      if (win.sceneManager.getActiveObject() !== a) throw new Error('ortho click không raycast đúng object A');
      click(b, { shiftKey: true });
      if (win.sceneManager.getSelectedObjects().length !== 2 || !win.sceneManager.isSelected(b)) throw new Error('ortho Shift-click không thêm B');
      click(a);
      if (win.sceneManager.getSelectedObjects().length !== 1 || engine.transformControls.object !== a) throw new Error('ortho click không attach gizmo vào A');
      const before = a.position.clone();
      const viewBefore = viewState(engine);
      press(win, 'g', 'KeyG');
      const modal = win.app.modalTransform;
      if (!modal.isActive) throw new Error('ortho G không start');
      const rect = canvas.getBoundingClientRect();
      const deltaPixels = 1.5 * engine.camera.zoom * rect.width / (engine.camera.right - engine.camera.left);
      win.dispatchEvent(new win.PointerEvent('pointermove', { clientX: modal.startMousePos.x + deltaPixels, clientY: modal.startMousePos.y, pointerId: 41, pointerType: 'mouse', bubbles: true }));
      const moved = before.clone().add(new win.THREE.Vector3(1.5, 0, 0));
      near(a.position.distanceTo(moved), 0, 'ortho ray/plane pointer translation', 1e-5);
      press(win, 'Enter', 'Enter');
      if (modal.isActive) throw new Error('Enter không commit G');
      press(win, 'z', 'KeyZ', { ctrlKey: true });
      near(a.position.distanceTo(before), 0, 'undo transform');
      if (!win.sceneManager.getAllObjects().includes(a)) throw new Error('undo xoá object thay vì transform');
      press(win, 'y', 'KeyY', { ctrlKey: true });
      near(a.position.distanceTo(moved), 0, 'redo transform', 1e-5);
      unchangedView(engine, viewBefore, 'picking/transform không đổi ortho view');
      return 'real raycast selection · G pointer ray/plane +1.5m · Enter · Ctrl+Z/Ctrl+Y';
    }));

    await test('Hard-Surface Stack & BoolTool: Live Cutter Sync, Decimate, Screw, Weighted Normal & English Inspector UI', async (win) => {
      await reset(win);
      const pro = win.blenderProTools || win.app?.blenderProTools;
      if (!pro) throw new Error('BlenderProTools missing');

      const hasLocalInteriorVert = (geom, limit = 0.49) => {
        const pos = geom?.attributes?.position;
        if (!pos) return false;
        for (let i = 0; i < pos.count; i++) {
          if (Math.max(Math.abs(pos.getX(i)), Math.abs(pos.getY(i)), Math.abs(pos.getZ(i))) < limit) {
            return true;
          }
        }
        return false;
      };

      const assertFiniteGeom = (geom, label) => {
        const pos = geom?.attributes?.position;
        if (!pos || pos.count === 0) throw new Error(`${label}: empty geometry`);
        for (let i = 0; i < pos.array.length; i++) {
          if (!Number.isFinite(pos.array[i])) throw new Error(`${label}: non-finite position`);
        }
      };

      // 1. Ctrl+Shift+B quick pie menu opens in English and Esc closes cleanly
      press(win, 'B', 'KeyB', { ctrlKey: true, shiftKey: true });
      await frames(win, 2);
      const boolPieTitle = win.document.querySelector('.blender-pie-title')?.textContent || '';
      if (!boolPieTitle.includes('Hard-Surface & Boolean')) {
        throw new Error(`Expected Hard-Surface & Boolean menu on Ctrl+Shift+B, got: "${boolPieTitle}"`);
      }
      press(win, 'Escape', 'Escape');
      await frames(win, 1);

      // 2. Multi-select cutter + host -> applyQuickBoolean('difference') -> live wireframe cutter
      const host = await addCube(win, 0);
      host.name = 'HardSurfaceHost';
      const cutter = await addCube(win, 0);
      cutter.name = 'HardSurfaceCutter';
      cutter.position.set(0.4, 1.35, 0.4);
      cutter.updateMatrixWorld(true);

      win.sceneManager.select(cutter, false);
      win.sceneManager.select(host, true);
      const qRes = await pro.applyQuickBoolean('difference');
      if (!qRes || qRes.host !== host) throw new Error('applyQuickBoolean did not resolve host/cutter');
      if (cutter.userData.__boolDisplayMode !== 'wire' || !cutter.material?.wireframe) {
        throw new Error(`Expected wireframe cutter display, got ${cutter.userData.__boolDisplayMode}`);
      }
      if (!hasLocalInteriorVert(host.geometry, 0.49)) {
        throw new Error('Expected live boolean difference to carve interior vertices in host');
      }

      // 3. Live Cutter Modal Transform (G -> X -> 6 -> Enter) updates host via Web Worker, Undo restores cut
      win.sceneManager.select(cutter, false);
      win.document.activeElement?.blur?.();
      await frames(win, 2);
      press(win, 'g', 'KeyG');
      press(win, 'x', 'KeyX');
      press(win, '6', 'Digit6');
      press(win, 'Enter', 'Enter');

        () => cutter.position.x > 5 && !hasLocalInteriorVert(host.geometry, 0.49),
        15000,
        'live boolean sync on modal cutter move'
      );

      win.sceneManager.undo();
      await waitUntil(
        () => cutter.position.x < 1 && hasLocalInteriorVert(host.geometry, 0.49),

      // 4. applyHardSurfacePolish (Bevel + Weighted Normal) + Inspector English modifier cards

        throw new Error(`Expected stack boolean,bevel,weighted_normal, got ${stackTypes.join(',')}`);
      }
      assertFiniteGeom(host.geometry, 'polished hard-surface host');

      win.sceneManager.select(host, false);
      win.document.querySelector('[data-tab="modifier"]')?.click();
      await frames(win, 3);
      const addSel = win.document.getElementById('modifier-add-select');
      const optVals = Array.from(addSel?.options || []).map((o) => o.value);

      }
      const cardTitles = Array.from(win.document.querySelectorAll('.modifier-card-title-group')).map((el) => el.textContent.trim());
      for (const title of ['Boolean', 'Bevel', 'Weighted Normal']) {
        if (!cardTitles.some((t) => t.includes(title))) {
          throw new Error(`Missing Inspector card "${title}", got: ${JSON.stringify(cardTitles)}`);
        }
      }

      // 5. Add Decimate & Screw via Inspector dropdown & verify Web Worker evaluation
      const testMesh = await addCube(win, 3);
      win.sceneManager.select(testMesh, false);

      await frames(win, 2);

      const sel1 = win.document.getElementById('modifier-add-select');

      sel1.dispatchEvent(new win.Event('change', { bubbles: true }));
      await waitUntil(() => (testMesh.userData.modifierStack || []).some((m) => m.type === 'decimate') && testMesh.geometry.attributes.position.count > 0, 15000, 'decimate worker eval');

      const sel2 = win.document.getElementById('modifier-add-select');

    });

      const remeshBtn = win.document.getElementById('btn-sculpt-remesh');
      if (!snakeHookBtn || !maskBtn || !invertBtn || !clearBtn || !voxelInput || !remeshBtn) {
        throw new Error('Missing Sculpt Mode 2.0 toolbar controls');
      }

      snakeHookBtn.click();
      if (win.sculptMode.brushType !== 'snake_hook') throw new Error('Snake Hook brush button failed');

      maskBtn.click();
      if (win.sculptMode.brushType !== 'mask') throw new Error('Mask brush button failed');

      win.sculptMode.setSymmetry(false);
      win.sculptMode.setRadius(0.6);
      win.sculptMode.setStrength(0.8);
      cube.updateMatrixWorld(true);
      const v0World = new win.THREE.Vector3()
        .fromBufferAttribute(cube.geometry.attributes.position, 0)
        .applyMatrix4(cube.matrixWorld);
      win.sculptMode.applyStroke({
        point: v0World,
        face: { normal: new win.THREE.Vector3(0, 1, 0) },
        object: cube
      }, { recordUndo: true });
      const paintedMax = Math.max(...(cube.userData.sculptMask || [0]));
      if (!(paintedMax > 0.1)) throw new Error(`Mask brush failed to paint vertices (${paintedMax})`);

      invertBtn.click();
      if (cube.userData.sculptMask[0] < 0.01 && Math.max(...cube.userData.sculptMask) < 0.99) {
        throw new Error('Invert Mask button failed');
      }
      clearBtn.click();
      if (Math.max(...cube.userData.sculptMask) !== 0) throw new Error('Clear Mask button failed');

      const origTris = cube.geometry.index ? cube.geometry.index.count / 3 : cube.geometry.attributes.position.count / 3;
      voxelInput.value = '0.25';
      voxelInput.dispatchEvent(new win.Event('change', { bubbles: true }));
      remeshBtn.click();
      await waitUntil(() => (cube.geometry.index ? cube.geometry.index.count / 3 : cube.geometry.attributes.position.count / 3) > origTris, 5000, 'voxel remesh');

      const remeshedTris = cube.geometry.index.count / 3;
      if (!(remeshedTris > 100)) throw new Error(`Expected Voxel Remesh > 100 tris, got ${remeshedTris}`);

      win.sceneManager.undo();
      const undoneTris = cube.geometry.index ? cube.geometry.index.count / 3 : cube.geometry.attributes.position.count / 3;
      if (undoneTris !== origTris) throw new Error(`Undo remesh failed: ${undoneTris} != ${origTris}`);

      win.sculptMode.exit();
      return `10 brushes · Mask ${paintedMax.toFixed(2)} -> Invert/Clear · Remesh ${origTris}->${remeshedTris} tris + Undo OK`;
    });

    updateSummary();
    window.__INTERACTION_DONE__ = true;
    if (results.some((r) => r.status === 'fail')) {
      window.__INTERACTION_FAILED__ = true;
    }
  </script>
</body>
</html>
