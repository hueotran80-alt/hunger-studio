<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Path Tracing Regression</title>
  <!-- The suite imports /js/render/pathtrace-*.js, which use bare 'three'
       specifiers; without an import map those modules fail to resolve. -->
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/three.module.js",
      "three/addons/": "../vendor/three/addons/"
    }
  }
  </script>
  <style>
    body { background:#181818;color:#ddd;font:14px system-ui;margin:16px; }
    iframe { width:960px;height:600px;border:1px solid #444; }
    li { margin:8px 0; } .pass { color:#8cdaac; } .fail { color:#f99; }
    #rendered { max-width:480px;border:1px solid #444; }
  </style>
</head>
<body>
  <h1>Path Tracing — GPU / UI regression</h1>
  <p id="summary">Đang chạy…</p>
  <ol id="results"></ol>
  <img id="rendered" alt="PNG render kiểm thử">
  <iframe id="studio" src="/index.html" title="Studio under test"></iframe>
  <script type="module">
    const frame = document.querySelector('#studio');
    const results = window.__PATH_TRACE_RESULTS__ = [];
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    assert.equal = (actual, expected, message) => {
      if (!Object.is(actual, expected)) {
        throw new Error(message || `kỳ vọng ${String(expected)}, nhận ${String(actual)}`);
      }
    };
    assert.throws = (fn, pattern, message) => {
      let thrown = null;
      try { fn(); } catch (error) { thrown = error; }
      if (!thrown) throw new Error(message || 'Hàm phải ném lỗi nhưng không ném');
      if (pattern && !pattern.test(String(thrown.message || thrown))) {
        throw new Error(message || `Sai thông điệp lỗi: ${thrown.message || thrown}`);
      }
    };
    async function until(check, timeout = 30000) {
      const start = performance.now();
      while (!check()) {
        if (performance.now() - start > timeout) throw new Error('Timeout');
        await sleep(30);
      }
    }
    async function pixels(url, win) {
      const image = new win.Image(); image.src = url; await image.decode();
      const canvas = win.document.createElement('canvas');
      canvas.width = image.width; canvas.height = image.height;
      const context = canvas.getContext('2d'); context.drawImage(image, 0, 0);
      const data = context.getImageData(0, 0, image.width, image.height).data;
      const colors = new Set(); let opaque = 0, transparent = 0;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3]) { opaque++; colors.add(`${data[i]},${data[i + 1]},${data[i + 2]}`); }
        else transparent++;
      }
      return { width:image.width, height:image.height, colors:colors.size, opaque, transparent, data };
    }
    function state(app) {
      const engine = app.engine, r = engine.renderer;
      const size = r.getSize({ set(x, y) { this.x=x;this.y=y;return this; } });
      return JSON.stringify({ size:[size.x,size.y],ratio:r.getPixelRatio(),running:engine.isRunning,
        camera:engine.camera.uuid,position:engine.camera.position.toArray(),zoom:engine.camera.zoom,
        target:engine.controls.target.toArray(),controls:engine.controls.enabled,
        tone:r.toneMapping,exposure:r.toneMappingExposure,clearAlpha:r.getClearAlpha(),
        renderTarget:r.getRenderTarget()?.uuid,children:app.sceneManager.getAllObjects().map((o)=>o.uuid) });
    }
    async function test(name, fn) {
      const row = document.createElement('li'); row.textContent = name; document.querySelector('#results').appendChild(row);
      try { const detail = await fn(); row.className='pass';row.textContent += ' — PASS '+(detail||'');results.push({name,ok:true,detail}); }
      catch (error) { row.className='fail';row.textContent += ' — FAIL '+error.message;results.push({name,ok:false,detail:error.stack}); }
    }
    try {
      await until(()=>frame.contentWindow.app?.pathTraceRender && frame.contentWindow.studio);
      const win=frame.contentWindow, app=win.app, manager=app.pathTraceRender;
      app.stemTutor?.setBubbleOpen(false);
      win.studio.clearScene();
      const cube=win.studio.addCube({name:'TraceCube',y:1,color:0xe05522});
      app.sceneManager.select(cube);
      app.engine.focusSelection();
      await sleep(100);
      await test('Lazy-load: pathtracer chưa tải lúc mở Studio; không vá Scene.prototype', async()=>{
        assert(!win.performance.getEntriesByType('resource').some((r)=>r.name.includes('/three-gpu-pathtracer/')), 'Tải bundle ngay khi mở app');
        const THREE=await import('/vendor/three/three.module.js');
        assert(!('backgroundRotation' in THREE.Scene.prototype), 'Prototype bị vá');
      });
      await test('PNG PBR qua MatCap: màu thật, cảnh/camera/renderer không đổi', async()=>{
        app.matcapStudio.toggleMatCapMode(true);
        assert(cube.material.isMeshMatcapMaterial && cube.userData.__originalMaterial?.isMeshStandardMaterial,'MatCap fixture absent');
        const before=state(app), displayed=cube.material, geometry=cube.geometry;
        const result=await manager.render({samples:4,scale:0.5});
        const image=await pixels(result.dataUrl,win);
        assert(image.colors>10 && image.opaque>100,'PNG trống hoặc đồng màu');
        assert(result.width===image.width && result.height===image.height,'PNG sai kích thước');
        assert(state(app)===before && cube.material===displayed && cube.geometry===geometry,'Cảnh gốc bị thay đổi');
        document.querySelector('#rendered').src=result.dataUrl;
        return `${image.width}×${image.height}; ${image.colors} màu`;
      });
      await test('Orthographic PNG + nền trong suốt; không đổi phép chiếu gốc', async()=>{
        app.engine.toggleProjection();
        const background=app.engine.scene.background; app.engine.scene.background=null;
        try {
          const before=state(app), result=await manager.render({samples:4,scale:0.5});
          const image=await pixels(result.dataUrl,win);
          assert(image.colors>10 && image.opaque>20 && image.transparent>20,'Không có mesh/nền alpha');
          assert(state(app)===before,'Orthographic bị thay đổi');
        } finally { app.engine.scene.background=background;app.engine.toggleProjection(); }
      });
      const THREE=await import('/vendor/three/three.module.js');
      const PathTraceRenderManager=manager.constructor;
      function isolated(scene,camera) {
        return new PathTraceRenderManager({engine:{scene,camera,renderer:app.engine.renderer},sceneManager:{rootContainer:scene}});
      }
      // Read-only size facade: new manager tests render at 96×64 without resizing the viewport.
      function bounded(scene,camera) {
        const viewport=app.engine.renderer;
        const renderer={getSize:(v)=>v.set(192,128),outputColorSpace:viewport.outputColorSpace,
          toneMapping:viewport.toneMapping,toneMappingExposure:viewport.toneMappingExposure};
        return new PathTraceRenderManager({engine:{scene,camera,renderer},sceneManager:{rootContainer:scene}});
      }
      function centerRGBA(image) {
        const sum=[0,0,0,0];let count=0;
        for(let y=Math.floor(image.height*0.4);y<image.height*0.6;y++)for(let x=Math.floor(image.width*0.4);x<image.width*0.6;x++) {
          const i=(y*image.width+x)*4;for(let c=0;c<4;c++)sum[c]+=image.data[i+c];count++;
        }
        assert(count>20,'Vùng đo PNG quá nhỏ');return sum.map((v)=>v/count);
      }
      await test('Denoise GPU xác định: Float/HalfFloat, giảm variance, giữ biên/RGB/alpha và tone mapping', async()=>{
        const [GPU,{FullScreenQuad},{createDenoiseMaterial}]=await Promise.all([
          win.eval("import('/vendor/three/three.module.js')"),
          win.eval("import('/vendor/three/addons/postprocessing/Pass.js')"),
          win.eval("import('/js/render/pathtrace-denoise.js')")
        ]);
        const width=64,height=48,before=state(app),renderer=new GPU.WebGLRenderer({alpha:true,
          antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:true});
        const resources=[],quads=[];let shaderError=false;
        renderer.debug.onShaderError=()=>{shaderError=true;};
        renderer.setPixelRatio(1);renderer.setSize(width,height,false);
        renderer.outputColorSpace=app.engine.renderer.outputColorSpace;
        const read=(quad)=>{
          renderer.setRenderTarget(null);renderer.setScissorTest(false);renderer.setClearColor(0,0);renderer.clear();quad.render(renderer);
          assert(!shaderError&&!renderer.getContext().isContextLost(),'Shader/context denoise lỗi');
          const data=new Uint8Array(width*height*4),gl=renderer.getContext();
          gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,data);
          assert(gl.getError()===gl.NO_ERROR,'Không đọc được framebuffer RGBA');return data;
        };
        const stats=(data,x0,x1,y0,y1)=>{
          const mean=[0,0,0],square=[0,0,0];let count=0;
          for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++) {
            const i=(y*width+x)*4;for(let c=0;c<3;c++){mean[c]+=data[i+c];square[c]+=data[i+c]**2;}count++;
          }
          for(let c=0;c<3;c++)mean[c]/=count;
          return {mean,variance:square.reduce((s,v,c)=>s+v/count-mean[c]**2,0)/3};
        };
        const details=[];
        try {
          assert(renderer.capabilities.isWebGL2&&renderer.extensions.has('EXT_color_buffer_float'),'GPU cần Float/HalfFloat');
          assert(app.engine.renderer.toneMapping!==GPU.NoToneMapping,'Fixture viewport cần tone mapping');
          for(const type of [GPU.FloatType,GPU.HalfFloatType]) {
            const values=new Float32Array(width*height*4),cleanValues=new Float32Array(values.length);
            for(let y=0;y<height;y++)for(let x=0;x<width;x++) {
              const i=(y*width+x)*4,alpha=y<16?1:y<32?0.5:0;
              const base=x<32?[0.72,0.065,0.035]:[0.035,0.065,0.72];
              // A clean band isolates edge retention from the intentional flat-region noise.
              const noise=x>=28&&x<36?0:(((x*17+y*29)&3)-1.5)*0.018;
              for(let c=0;c<3;c++) {
                values[i+c]=alpha?base[c]+noise:0;
                cleanValues[i+c]=alpha?base[c]:0;
              }
              values[i+3]=cleanValues[i+3]=alpha;
            }
            const bytes=type===GPU.FloatType?values:Uint16Array.from(values,(v)=>GPU.DataUtils.toHalfFloat(v));
            const cleanBytes=type===GPU.FloatType?cleanValues:Uint16Array.from(cleanValues,(v)=>GPU.DataUtils.toHalfFloat(v));
            const texture=new GPU.DataTexture(bytes,width,height,GPU.RGBAFormat,type);
            const cleanTexture=new GPU.DataTexture(cleanBytes,width,height,GPU.RGBAFormat,type);
            for(const map of [texture,cleanTexture]) {
              map.minFilter=map.magFilter=GPU.NearestFilter;map.generateMipmaps=false;
              map.colorSpace=GPU.LinearSRGBColorSpace;map.needsUpdate=true;resources.push(map);
            }
            const original=bytes.slice(),version=texture.version,image=texture.image;
            const textureSettings=()=>JSON.stringify([texture.type,texture.format,texture.colorSpace,texture.minFilter,
              texture.magFilter,texture.wrapS,texture.wrapT,texture.generateMipmaps,texture.flipY,texture.premultiplyAlpha,texture.unpackAlignment]);
            const settings=textureSettings();
            let sourceDisposed=false;texture.addEventListener('dispose',()=>{sourceDisposed=true;});
            const rawMaterial=new GPU.MeshBasicMaterial({map:texture,transparent:true,blending:GPU.NoBlending,depthTest:false,depthWrite:false});
            const filteredMaterial=createDenoiseMaterial(texture);
            const cleanMaterial=new GPU.MeshBasicMaterial({map:cleanTexture,transparent:true,blending:GPU.NoBlending,depthTest:false,depthWrite:false});
            resources.push(rawMaterial,filteredMaterial,cleanMaterial);
            assert(filteredMaterial.map===texture&&filteredMaterial.sigma===2&&filteredMaterial.kSigma===1&&filteredMaterial.threshold===0.1,'Mất cấu hình production');
            const rawQuad=new FullScreenQuad(rawMaterial),filteredQuad=new FullScreenQuad(filteredMaterial),cleanQuad=new FullScreenQuad(cleanMaterial);
            quads.push(rawQuad,filteredQuad,cleanQuad);
            let unmapped;
            for(const tone of [GPU.NoToneMapping,app.engine.renderer.toneMapping]) {
              renderer.toneMapping=tone;renderer.toneMappingExposure=tone===GPU.NoToneMapping?1:app.engine.renderer.toneMappingExposure*1.7;
              const raw=read(rawQuad),filtered=read(filteredQuad),rawAfter=read(rawQuad),clean=read(cleanQuad);
              assert(raw.every((v,i)=>v===rawAfter[i]),'Bộ lọc ghi vào texture GPU nguồn');
              assert(!sourceDisposed&&texture.image===image&&texture.version===version&&textureSettings()===settings&&bytes.every((v,i)=>v===original[i]),'Texture CPU/thuộc tính nguồn bị đổi');
              for(let y=0;y<height;y++)for(let x=0;x<width;x++) {
                const i=(y*width+x)*4,expected=y<16?255:y<32?128:0;
                assert(Math.abs(raw[i+3]-expected)<=1&&Math.abs(filtered[i+3]-raw[i+3])<=1,'Alpha/coverage đổi tại '+x+','+y);
              }
              for(const [x0,x1] of [[4,28],[36,60]])for(const y0 of [4,20]) {
                const a=stats(raw,x0,x1,y0,y0+8),b=stats(filtered,x0,x1,y0,y0+8),reference=stats(clean,x0,x1,y0,y0+8);
                assert(a.variance>3&&b.variance<a.variance*0.65,'Không giảm variance đáng kể: '+a.variance+' → '+b.variance);
                // Tone mapping is nonlinear, so averaging noisy output is not the clean color reference.
                assert(b.mean.every((v,c)=>Math.abs(v-reference.mean[c])<3),'RGB lệch màu sạch: '+reference.mean+' → '+b.mean);
                const colorError=(mean)=>mean.reduce((sum,v,c)=>sum+Math.abs(v-reference.mean[c]),0);
                assert(colorError(b.mean)<=colorError(a.mean)+1,'Lọc làm tăng sai số màu sạch');
                details.push((b.variance/a.variance).toFixed(2));
              }
              for(const x of [31,32])for(const y of [8,15,16,24,31]) {
                const i=(y*width+x)*4,dominant=x<32?0:2,other=x<32?2:0;
                assert(filtered[i+dominant]>filtered[i+other]+50,'Biên màu bão hoà bị trộn');
                for(let c=0;c<3;c++)assert(Math.abs(filtered[i+c]-raw[i+c])<5,'RGB biên/alpha bị tối hoặc chảy màu');
              }
              for(const [x0,x1] of [[4,28],[36,60]]) {
                const opaque=stats(filtered,x0,x1,4,12),half=stats(filtered,x0,x1,20,28);
                assert(opaque.mean.every((v,c)=>Math.abs(v-half.mean[c])<2),'Straight RGB bị nhân alpha trước/sau tone mapping');
              }
              if(tone===GPU.NoToneMapping)unmapped=raw;
              else assert(raw.some((v,i)=>i%4!==3&&Math.abs(v-unmapped[i])>10),'Tone mapping/exposure không thực sự chạy');
            }
          }
          assert(state(app)===before,'Renderer GPU riêng làm đổi viewport');
          return 'variance filtered/raw: '+details.join(',');
        } finally {
          quads.forEach((quad)=>quad.dispose());resources.forEach((resource)=>resource.dispose());
          renderer.dispose();renderer.forceContextLoss();
        }
      });
      await test('Manager PNG denoise on/off/default: straight RGB bán trong suốt, flags và nguồn nguyên vẹn', async()=>{
        const scene=new THREE.Scene(),g=new THREE.PlaneGeometry(2,1.2);
        const bytes=new Uint8Array([255,255,255,255]),texture=new THREE.DataTexture(bytes,1,1);texture.needsUpdate=true;
        const material=new THREE.MeshStandardMaterial({map:texture,color:0,emissive:0x486080,metalness:1,roughness:1,transparent:true});
        const mesh=new THREE.Mesh(g,material);scene.add(mesh);
        const camera=new THREE.OrthographicCamera(-1.5,1.5,1,-1,0.1,10);camera.position.z=4;
        const tracer=bounded(scene,camera),before=state(app),positions=Array.from(g.attributes.position.array),version=texture.version;
        let disposed=false;for(const resource of [g,material,texture])resource.addEventListener('dispose',()=>{disposed=true;});
        const phases=[];
        try {
          const baseline=await tracer.render({samples:4,scale:0.5,onProgress:(_p,_n,phase)=>phases.push(phase)});
          assert(baseline.denoised===false&&!phases.includes('Denoising…'),'Default không giữ pipeline gốc');
          const opaque=centerRGBA(await pixels(baseline.dataUrl,win));material.opacity=0.5;
          phases.length=0;
          const off=await tracer.render({samples:32,scale:0.5,denoise:false,onProgress:(_p,_n,phase)=>phases.push(phase)});
          assert(off.denoised===false&&!phases.includes('Denoising…'),'Explicit off vẫn lọc');
          phases.length=0;
          const on=await tracer.render({samples:32,scale:0.5,denoise:true,onProgress:(p,n,phase)=>{
            phases.push(phase);if(phase==='Denoising…')assert(p===1&&n===32&&tracer.busy,'Phase denoise sai');
          }});
          assert(on.denoised===true&&phases.filter((p)=>p==='Denoising…').length===1,'Thiếu flag/phase on');
          const images=await Promise.all([pixels(off.dataUrl,win),pixels(on.dataUrl,win)]),averages=images.map(centerRGBA);
          for(let j=0;j<images.length;j++) {
            const image=images[j],rgba=averages[j],result=j?on:off;
            assert(image.width===96&&image.height===64&&result.width===image.width&&result.height===image.height,'Sai PNG bounded');
            assert(image.opaque>100&&image.transparent>100,'PNG mất mesh/nền alpha');
            assert(rgba[3]>90&&rgba[3]<165,'Alpha bán trong suốt sai: '+rgba);
            for(let c=0;c<3;c++)assert(Math.abs(rgba[c]-opaque[c])<8,'PNG straight RGB bị tối/cháy: '+opaque+' → '+rgba);
          }
          for(let c=0;c<3;c++)assert(Math.abs(averages[0][c]-averages[1][c])<8,'On/off đổi màu PNG');
          assert(!disposed&&mesh.geometry===g&&mesh.material===material&&material.map===texture&&material.opacity===0.5,'Denoise sửa/dispose nguồn');
          assert(texture.version===version&&bytes.every((v)=>v===255)&&JSON.stringify(Array.from(g.attributes.position.array))===JSON.stringify(positions),'Texture/geometry nguồn bị ghi');
          assert(state(app)===before&&!tracer.busy,'Viewport/busy không khôi phục');
          return 'on RGBA '+averages[1].map((v)=>v.toFixed(1)).join(',');
        } finally {g.dispose();material.dispose();texture.dispose();}
      });
      await test('Denoise: input không boolean, huỷ sau yield, overlap/callback lỗi giải phóng context rồi render lại', async()=>{
        const scene=new THREE.Scene(),g=new THREE.PlaneGeometry(2,1.2);
        const material=new THREE.MeshStandardMaterial({color:0,emissive:0x486080,metalness:1,roughness:1});
        const mesh=new THREE.Mesh(g,material);scene.add(mesh);
        const camera=new THREE.OrthographicCamera(-1.5,1.5,1,-1,0.1,10);camera.position.z=4;
        const tracer=bounded(scene,camera),before=state(app),contexts=[];
        const prototype=win.HTMLCanvasElement.prototype,getContext=prototype.getContext;
        let disposed=false;g.addEventListener('dispose',()=>{disposed=true;});material.addEventListener('dispose',()=>{disposed=true;});
        prototype.getContext=function(...args) {
          const context=getContext.apply(this,args);
          if((args[0]==='webgl2'||args[0]==='webgl')&&context&&context!==app.engine.renderer.getContext()&&!contexts.includes(context))contexts.push(context);
          return context;
        };
        try {
          const busyDescriptor=Object.getOwnPropertyDescriptor(tracer,'busy');let busyValue=tracer.busy,busyWrites=0;
          Object.defineProperty(tracer,'busy',{configurable:true,get:()=>busyValue,set:(value)=>{busyValue=value;busyWrites++;}});
          try {
            for(const denoise of [null,0,1,'false','true',[],{},new win.Boolean(false)]) {
              let error,called=false;try {await tracer.render({samples:2,scale:0.5,denoise,onProgress:()=>{called=true;}});}catch(e){error=e;}
              assert(error?.message.includes('true or false')&&!called&&!tracer.busy&&busyWrites===0&&contexts.length===0,'Nonboolean không bị chặn trước busy/GPU');
            }
          } finally {Object.defineProperty(tracer,'busy',busyDescriptor);}
          let reached=false,cancelledAfterYield=false,overlap;
          const cancelled=await tracer.render({samples:2,scale:0.5,denoise:true,onProgress:(_p,_n,phase)=>{
            if(phase==='Denoising…') {
              reached=true;
              overlap=tracer.render({samples:1,scale:0.5,denoise:false}).then(()=>false,(e)=>e.message.includes('already running'));
              win.setTimeout(()=>{cancelledAfterYield=true;tracer.cancel();},0);
            }
          }});
          assert(reached&&cancelledAfterYield&&cancelled===null&&await overlap,'Không huỷ sau yield/chặn overlap ở denoise');
          assert(!tracer.busy&&state(app)===before,'Cancel giữ busy/đổi viewport');
          const sentinel=new win.Error('Denoise callback sentinel');let error;
          try {await tracer.render({samples:2,scale:0.5,denoise:true,onProgress:(_p,_n,phase)=>{if(phase==='Denoising…')throw sentinel;}});}catch(e){error=e;}
          assert(error===sentinel&&!tracer.busy&&state(app)===before,'Callback error không truyền/cleanup');
          const again=await tracer.render({samples:2,scale:0.5,denoise:true});
          const image=await pixels(again.dataUrl,win);
          assert(again.denoised===true&&image.opaque>100&&image.transparent>100,'Không render PNG thật sau cancel/error');
          assert(contexts.length===3,'Không theo dõi đủ context GPU riêng: '+contexts.length);
          await until(()=>contexts.every((context)=>context.isContextLost()),5000);
          assert(!disposed&&mesh.geometry===g&&mesh.material===material&&!tracer.busy&&state(app)===before,'Cleanup dispose nguồn/đổi viewport');
          return '3 context riêng đã release; render lại có PNG';
        } finally {prototype.getContext=getContext;g.dispose();material.dispose();}
      });
      await test('PNG giữ màu đỏ/xanh lá/xanh dương của mesh đa vật liệu và mesh kế tiếp', async()=>{
        const scene=new THREE.Scene();scene.background=new THREE.Color(0x111111);
        const materials=[0xff0000,0x00ff00,0x0000ff,0xffff00].map((emissive)=>new THREE.MeshStandardMaterial({color:0,emissive,metalness:1,roughness:1}));
        const g=new THREE.BufferGeometry(), positions=[];
        for(let i=0;i<3;i++) {
          const part=new THREE.PlaneGeometry(0.8,1).toNonIndexed();part.translate(i-1.5,0,0);
          positions.push(...part.attributes.position.array);part.dispose();g.addGroup(i*6,6,i);
        }
        g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.computeVertexNormals();
        const multi=new THREE.Mesh(g,materials.slice(0,3));
        const last=new THREE.Mesh(new THREE.PlaneGeometry(0.8,1),materials[3]);last.position.x=1.5;scene.add(multi,last);
        const camera=new THREE.OrthographicCamera(-3,3,1.5,-1.5,0.1,10);camera.position.z=4;
        const before=state(app);
        try {
          const result=await isolated(scene,camera).render({samples:4,scale:0.5}), image=await pixels(result.dataUrl,win);
          const counts=[0,0,0,0];
          for(let i=0;i<image.data.length;i+=4) {

          return { canvas: win.document.createElement('canvas') };
        };
        const abortedRes = await session.render({ signal: abortCtrl.signal });
        assert.equal(abortedRes, null, 'AbortController phải dừng session và trả về null');

        return 'Hero frame kẹp 32 samples; AbortSignal huỷ tức thì';
      });
    } catch (error) { results.push({name:'Khởi tạo suite',ok:false,detail:error.stack}); }
    document.querySelector('#summary').textContent=`${results.filter((r)=>r.ok).length}/${results.length} PASS`;
  </script>
</body>
</html>
