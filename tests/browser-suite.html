<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Web Blender Studio — Browser Regression Suite</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #141414; color: #e6e6e6; font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { padding: 16px 20px; border-bottom: 1px solid #2f2f2f; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 15px; margin: 0; font-weight: 600; }
    #summary { padding: 3px 10px; border-radius: 999px; background: #2a2a2a; border: 1px solid #3d3d3d; font-variant-numeric: tabular-nums; }
    #summary.pass { background: #12351f; border-color: #2ecc71; color: #8ef0b0; }
    #summary.fail { background: #3a1414; border-color: #e74c3c; color: #ff9b90; }
    main { display: grid; grid-template-columns: minmax(420px, 1fr) 900px; gap: 16px; padding: 16px 20px; align-items: start; }
    ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    li { border: 1px solid #2f2f2f; border-radius: 6px; padding: 9px 11px; background: #1b1b1b; }
    li.pass { border-color: #245c39; }
    li.fail { border-color: #7a2e2a; background: #221515; }
    li.running { border-color: #4a4a2a; }
    .name { font-weight: 600; }
    .detail { color: #9aa0a6; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
    .badge { float: right; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #2a2a2a; }
    li.pass .badge { background: #1d4d30; color: #8ef0b0; }
    li.fail .badge { background: #5a1f1c; color: #ffb4ab; }
    iframe { width: 900px; height: 560px; border: 1px solid #2f2f2f; border-radius: 6px; background: #000; }
    code { color: #8ab4f8; }
  </style>
</head>
<body>
  <header>
    <h1>Web Blender Studio — Browser Regression Suite</h1>
    <span id="summary">Đang chạy…</span>
    <span class="detail">Mở trang này khi server đang chạy. Kết quả cũng nằm trong <code>window.__SUITE_RESULTS__</code>.</span>
  </header>

  <main>
    <ol id="results"></ol>
    <iframe id="studio" src="/index.html" title="Web Blender Studio under test"></iframe>
  </main>

  <script type="module">
    const iframe = document.getElementById('studio');
    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const results = [];

    async function waitUntil(check, timeoutMs = 20000, label = 'condition') {
      const started = Date.now();
      while (Date.now() - started < timeoutMs) {
        try {
          if (await check()) return true;
        } catch (_) { /* frame or element not ready */ }
        await sleep(120);
      }
      throw new Error(`Timeout: ${label}`);
    }

    function frames(win, count = 2) {
      return new Promise((resolve) => {
        let left = count;
        const step = () => {
          left -= 1;
          if (left <= 0) resolve();
          else win.requestAnimationFrame(step);
        };
        win.requestAnimationFrame(step);
      });
    }

    async function waitForStudio(win, timeoutMs = 30000) {
      const started = Date.now();
      while (Date.now() - started < timeoutMs) {
        const ready = win.app && win.app._advancedLoaded && win.app.engine && win.app.exporter &&
          win.sceneManager && win.engine && win.outliner && win.inspector && win.rigSystem &&
          win.blenderProTools && win.timelineEngine && win.studio && win.simulationManager && win.physicsPanel;
        if (ready) return;
        await sleep(120);
      }
      throw new Error('Studio did not initialise within 30s');
    }

    async function reset(win) {
      try { win.studio.clearScene(); } catch (_) {}
      await frames(win, 3);
      await sleep(120);
    }

    async function createCopilotRuntime(win) {
      return win.eval(`(async () => {
        const { CopilotRuntime } = await import('/js/ai/copilot-runtime.js');
        return new CopilotRuntime({
          sceneManager: window.sceneManager,
          studio: window.studio,
          THREE: window.THREE,
          camera: window.engine.camera,
          engine: window.engine,
          editMode: window.editMode,
          modifiers: window.modifiers || window.Modifiers,
          simulationManager: window.simulationManager,
          sculptMode: window.sculptMode,
          stemTutor: window.stemTutor,
          setViewportMode: (mode) => window.stemTutor?._switchModeSafely?.(mode) || false,
          setEditSelectionMode: (mode) => window.editMode?.setMode?.(mode) || false,
        });
      })()`);
    }

    function addItem(name) {
      const li = document.createElement('li');
      li.className = 'running';
      li.innerHTML = `<span class="badge">…</span><div class="name"></div><div class="detail"></div>`;
      li.querySelector('.name').textContent = name;
      resultsEl.appendChild(li);
      return li;
    }

    function finishItem(li, ok, detail) {
      li.className = ok ? 'pass' : 'fail';
      li.querySelector('.badge').textContent = ok ? 'PASS' : 'FAIL';
      li.querySelector('.detail').textContent = detail || '';
    }

    function assertCloseArray(actual, expected, label, tolerance = 1e-7) {
      if (!Array.isArray(actual) || !Array.isArray(expected) || actual.length !== expected.length ||
          actual.some((value, i) => !Number.isFinite(value) || !Number.isFinite(expected[i]) ||
            Math.abs(value - expected[i]) > tolerance)) {
        throw new Error(`${label}: ${JSON.stringify(actual)} != ${JSON.stringify(expected)}`);
      }
    }

    function describeTrackedObjects(sm) {
      return sm.getAllObjects().map((object) => ({
        name: object.name,
        type: object.type,
        uuid: object.uuid,
        parent: object.parent?.name || null,
      }));
    }

    // ------------------------------------------------------------------
    // Tests
    // ------------------------------------------------------------------
    const tests = [
      {
        name: 'Xoá object giải phóng geometry GPU',
        async run(win) {
          // engine.deleteSelection() disposes geometry/material; undo must still work.
          await reset(win);
          const r = win.renderer;
          const sm = win.sceneManager;
          const base = r.info.memory.geometries;
          // Place all 8 cubes inside the default camera frustum so Three.js uploads every geometry (no frustum culling).
          for (let i = 0; i < 8; i++) {
            win.studio.addCube({
              x: (i % 4) * 1.1 - 1.65,
              y: Math.floor(i / 4) * 1.1 + 0.5,
              z: 0,
              width: 0.7, height: 0.7, depth: 0.7,
              name: 'Gpu' + i,
            });
          }
          await sleep(180);
          await frames(win, 2);
          const afterAdd = r.info.memory.geometries;
          if (afterAdd < base + 8) throw new Error(`geometry chưa upload: ${base} → ${afterAdd}`);
          sm.setSelection(sm.getAllObjects());
          const removed = win.engine.deleteSelection();
          await sleep(180);
          await frames(win, 2);
          const afterDel = r.info.memory.geometries;
          if (removed !== 8) throw new Error(`deleteSelection xoá ${removed}/8 object`);
          if (sm.getAllObjects().length !== 0) throw new Error('scene còn object sau khi xoá');
          if (afterDel > base + 2) throw new Error(`rò rỉ GPU: ${base} → ${afterAdd} → ${afterDel}`);
          return `geometries ${base} → ${afterAdd} → ${afterDel}`;
        },
      },
      {
        name: 'Undo sau khi xoá khôi phục object render được',
        async run(win) {
          await reset(win);
          const sm = win.sceneManager;
          const cube = win.studio.addCube({ x: 0, y: 1, z: 0, name: 'UndoTest' });
          await frames(win, 2);
          sm.select(cube);
          win.engine.deleteSelection();
          await frames(win, 2);
          if (sm.getAllObjects().length !== 0) throw new Error('object chưa bị xoá');
          sm.undo();
          await sleep(160);
          await frames(win, 2);
          const restored = sm.getAllObjects()[0];
          if (!restored) throw new Error('undo không khôi phục object');
          if (!restored.geometry?.attributes?.position?.count) throw new Error('geometry bị hỏng sau undo');
          return `khôi phục "${restored.name}" (${restored.geometry.attributes.position.count} đỉnh)`;
        },
      },
      {
        name: 'Nhân bản nhân vật rig có skeleton độc lập',
        async run(win) {
          await reset(win);
          const THREE = win.THREE;
          const root = new THREE.Group();
          root.name = 'RigTest';
          const bone1 = new THREE.Bone();
          bone1.name = 'Bone1';
          bone1.position.y = 1;
          const bone2 = new THREE.Bone();
          bone2.name = 'Bone2';
          bone2.position.y = 1;
          bone1.add(bone2);
          const geometry = new THREE.CylinderGeometry(0.2, 0.2, 2, 8, 4);
          const position = geometry.attributes.position;
          const skinIndex = [];
          const skinWeight = [];
          for (let i = 0; i < position.count; i++) {
            skinIndex.push(0, 1, 0, 0);
            skinWeight.push(1, 0, 0, 0);
          }
          geometry.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndex, 4));
          geometry.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeight, 4));
          const mesh = new THREE.SkinnedMesh(geometry, new THREE.MeshStandardMaterial());
          mesh.add(bone1);
          mesh.bind(new THREE.Skeleton([bone1, bone2]));
          root.add(mesh);
          win.sceneManager.addObject(root, null, true, false);
          const duplicate = win.sceneManager.duplicateObject(root, { x: 2, y: 0, z: 0 });
          const skinned = (node) => {
            const found = [];
            node.traverse((child) => { if (child.isSkinnedMesh) found.push(child); });
            return found[0];
          };
          const a = skinned(root);
          const b = skinned(duplicate);
          if (!a || !b) throw new Error('không tìm thấy SkinnedMesh');
          if (a.skeleton === b.skeleton) throw new Error('hai bản dùng chung skeleton');
          if (a.skeleton.bones[0] === b.skeleton.bones[0]) throw new Error('hai bản dùng chung bone');
          b.skeleton.bones[0].rotation.z = 1;
          if (Math.abs(a.skeleton.bones[0].rotation.z - 1) < 1e-9) throw new Error('xoay bone bản clone ảnh hưởng bản gốc');
          return `clone độc lập: ${b.skeleton.bones.length} bone`;
        },
      },
      {
        name: 'Outliner gộp render theo animation frame',
        async run(win) {
          await reset(win);
          let count = 0;
          const original = win.outliner.render;
          win.outliner.render = function (...args) { count += 1; return original.apply(this, args); };
          try {
            for (let i = 0; i < 25; i++) {
              win.studio.addCube({ x: i, y: 0, z: 0, name: 'OL' + i });
            }
            const synchronous = count;
            await frames(win, 3);
            await sleep(60);
            const batched = count;
            if (synchronous !== 0) throw new Error(`render chạy ${synchronous} lần ngay trong vòng lặp`);
            if (batched > 1) throw new Error(`25 object → ${batched} lần render (cần ≤ 1)`);
            return `25 add → ${batched} lần render`;
          } finally {
            win.outliner.render = original;
          }
        },
      },
      {
        name: 'Inspector gộp render khi thêm nhiều object',
        async run(win) {
          await reset(win);
          let count = 0;
          const original = win.inspector.render;
          win.inspector.render = function (...args) { count += 1; return original.apply(this, args); };
          try {
            for (let i = 0; i < 25; i++) {
              win.studio.addCube({ x: i, y: 0, z: 0, name: 'Ins' + i });
            }
            const synchronous = count;
            await frames(win, 3);
            await sleep(80);
            const batched = count;
            if (synchronous !== 0) throw new Error(`inspector render chạy ${synchronous} lần ngay trong vòng lặp`);
            if (batched > 1) throw new Error(`25 object → ${batched} lần render (cần ≤ 1)`);
            return `25 add → ${batched} lần render`;
          } finally {
            win.inspector.render = original;
          }
        },
      },
      {
        name: 'Inspector hiển thị được giá trị Transform',
        async run(win) {
          await reset(win);
          const cube = win.studio.addCube({ x: 3, y: 1, z: 0, name: 'InspectMe' });
          win.sceneManager.select(cube);
          await sleep(260);
          const input = win.document.querySelector('#inspector-container .scrub-input');
          if (!input) throw new Error('không tìm thấy ô scrub');
          const box = input.closest('.scrub-input-wrap') || input;
          const width = input.getBoundingClientRect().width;
          const boxWidth = box.getBoundingClientRect().width;
          // Regression guard for P1-7: the field used to collapse to 12px.
          if (boxWidth < 60) throw new Error(`khung ô số chỉ rộng ${boxWidth.toFixed(1)}px (cần ≥ 60px)`);
          if (width < 40) throw new Error(`ô số chỉ rộng ${width.toFixed(1)}px (cần ≥ 40px)`);
          return `ô số ${width.toFixed(1)}px trong khung ${boxWidth.toFixed(1)}px`;
        },
      },
      {
        name: 'Thêm 120 object trong ngân sách thời gian',
        async run(win) {
          await reset(win);
          win.inspector.setTargetObject(null);
          const t0 = performance.now();
          for (let i = 0; i < 120; i++) {
            win.studio.addCube({ x: i % 12, y: Math.floor(i / 12), z: 0, name: 'Perf' + i });
          }
          const addMs = performance.now() - t0;
          await frames(win, 3);
          await sleep(60);
          const totalMs = performance.now() - t0;
          const created = win.sceneManager.getAllObjects().length;
          if (created < 120) throw new Error(`chỉ tạo ${created}/120 object`);
          // Before the rAF batching fix the synchronous loop alone took ~2.9s
          // (every addCube rebuilt the whole Outliner + Inspector DOM).
          if (addMs > 1200) throw new Error(`thêm 120 object mất ${addMs.toFixed(0)} ms (ngân sách 1200 ms)`);
          // Headless Chrome uses SwiftShader; one WebGL frame of 120 cubes costs
            // ~1s, so keep the strict 2s budget for real browsers only.
            const headless = /HeadlessChrome/.test(navigator.userAgent);
            const totalBudget = headless ? 4000 : 2000;
            if (totalMs > totalBudget) throw new Error(`120 object tới frame kế tiếp mất ${totalMs.toFixed(0)} ms (ngân sách ${totalBudget} ms${headless ? ' headless' : ''})`);
            return `120 object: ${addMs.toFixed(0)} ms thêm, ${totalMs.toFixed(0)} ms tới frame kế tiếp`;
        },
      },
      {
        name: 'Timeline từ chối frame không hợp lệ',
        async run(win) {
          await reset(win);
          const cube = win.studio.addCube({ x: 0, y: 0, z: 0, name: 'NaNTest' });
          const bad = win.timelineEngine.insertKeyframe(cube, 'position');
          if (bad !== null) throw new Error('frame sai vẫn tạo keyframe');
          if (!Number.isFinite(cube.position.x)) throw new Error('position bị NaN sau thao tác sai');
          win.timelineEngine.insertKeyframe(cube, 10, ['position']);
          if (!cube.position.x === 0) throw new Error('keyframe hợp lệ không được tạo');
          return 'frame sai bị chặn, keyframe hợp lệ vẫn hoạt động';
        },
      },
      {
        name: 'Autosave lưu và đọc lại được bản nháp',
        async run(win) {
          await reset(win);
          win.studio.addCube({ x: 0, y: 1, z: 0, name: 'AutoSave' });
          if (typeof win.app.saveAutosaveNow !== 'function') throw new Error('thiếu app.saveAutosaveNow');
          const size = await win.app.saveAutosaveNow();
          if (!size || size < 100) throw new Error(`autosave quá nhỏ: ${size}`);
          const draft = await win.app.loadAutosaveDraft();
          if (!draft || !draft.json) throw new Error('không đọc lại được draft');
          if (!draft.json.includes('AutoSave')) throw new Error('draft thiếu object vừa tạo');
          const sizeKb = (draft.json.length / 1024).toFixed(1);
          await win.app.clearAutosaveDraft();
          return `${sizeKb} KB, lưu lúc ${new Date(draft.savedAt).toLocaleTimeString()}`;
        },
      },
      {
        name: 'Không còn secret trong localStorage',
        async run(win) {
          const forbidden = Object.keys(win.localStorage).filter((key) =>
            /(gemini|openai|motapis|custom)_?key|api_key|hf_token|huggingface/i.test(key));
          if (forbidden.length) throw new Error('localStorage còn: ' + forbidden.join(', '));
          return 'không có API key / HF token trong trình duyệt';
        },
      },
      {
        name: 'Bridge có đúng một WebSocket và đang mở',
        async run(win) {
          if (!win.studioBridge) throw new Error('không có studioBridge');
          if (win.studioBridge !== win.app.bridge) throw new Error('tồn tại bridge thứ hai ngoài app');
          if (!win.studioBridge.ws || win.studioBridge.ws.readyState !== 1) {
            throw new Error('WebSocket bridge chưa mở');
          }
          return 'một kết nối WS duy nhất, trạng thái OPEN';
        },
      },
      {
        name: 'Share: liên kết tự chứa + preview + MatCap được khôi phục',
        async run(win) {
          await reset(win);
          win.studio.addCube({ x: 0, y: 1, z: 0, name: 'ShareCube' });
          await sleep(120);
          const dialog = win.shareDialog || (await win.app._ensureShareDialog?.());
          if (!dialog) throw new Error('thiếu app.shareDialog');
          const matcap = win.app.matcapStudio;
          matcap.toggleMatCapMode(true);
          if (!matcap.isMatCapActive) throw new Error('không bật được MatCap để kiểm tra');
          dialog.open();
          const status = () => win.document.getElementById('ss-status').textContent;
          await waitUntil(() => /Ready/.test(status()), 30000, 'share link');
          if (!matcap.isMatCapActive) throw new Error('MatCap không được bật lại sau khi xuất');
          const link = win.document.getElementById('ss-link').value;
          if (!link.startsWith(win.location.origin + '/embed.html')) throw new Error('sai embed URL: ' + link);
          if (!link.includes('#z=z')) throw new Error('thiếu payload gzip trong fragment');
          const snippet = win.document.getElementById('ss-iframe').value;
          if (!snippet.startsWith('<iframe') || !snippet.includes(link.split('&')[0])) {
            throw new Error('mã nhúng không khớp liên kết');
          }

          const frame = win.document.querySelector('#ss-preview iframe');
          if (!frame) throw new Error('không có iframe xem trước');
          await waitUntil(() => frame.contentWindow?.studioEmbed?.ready, 30000, 'preview ready');
          const viewer = frame.contentWindow.studioEmbed;
          const state = viewer.getState();
          if (!(state.quality.triangles > 0)) throw new Error('preview rỗng');
          let matType = '';
          viewer.model.traverse((node) => {
            if (node.isMesh && !matType) {
              const material = Array.isArray(node.material) ? node.material[0] : node.material;
              matType = material && material.type || '';
            }
          });
          if (matType === 'MeshMatcapMaterial') throw new Error('xuất phải dùng vật liệu PBR gốc, không phải MatCap');

          dialog.close();
          matcap.toggleMatCapMode(false);
          return `link ${link.length} ký tự · preview ${state.quality.triangles} tam giác · ${matType}`;
        },
      },
      {
        name: 'Share: mô hình quá lớn bị chặn khỏi URL, vẫn tải .glb được',
        async run(win) {
          const dialog = win.shareDialog || (await win.app._ensureShareDialog?.());
          if (!dialog) throw new Error('thiếu app.shareDialog');
          dialog.open();
          const statusText = () => win.document.getElementById('ss-status').textContent;
          await waitUntil(() => /Ready/.test(statusText()), 30000, 'dialog open');
          dialog.payload = 'z' + 'A'.repeat(200000);
          dialog._regenerate();
          await sleep(150);
          const link = win.document.getElementById('ss-link').value;
          const warning = win.document.getElementById('ss-warning');
          const status = win.document.getElementById('ss-status').textContent;
          if (link) throw new Error('vẫn tạo liên kết cho payload quá lớn');
          if (warning.hidden || !/too large/i.test(warning.textContent)) throw new Error('missing too-large warning');
          if (/0 B/.test(status) || /Ready/.test(status)) throw new Error('status does not reflect too-large');
          if (win.document.getElementById('ss-download').disabled) throw new Error('nút tải .glb phải bật');
          const frame = win.document.querySelector('#ss-preview iframe');
          if (!frame || !frame.src.includes('glb=blob')) throw new Error('preview phải dùng blob URL');
          dialog.close();
          return 'chặn URL · preview blob · tải .glb bật';
        },
      },
      {
        name: 'Share: controls=0 vào liên kết và preview',
        async run(win) {
          const dialog = win.shareDialog || (await win.app._ensureShareDialog?.());
          if (!dialog) throw new Error('thiếu app.shareDialog');
          dialog.payload = '';
          dialog.open();
          const status = () => win.document.getElementById('ss-status').textContent;
          await waitUntil(() => /Ready/.test(status()), 30000, 'share link');
          const checkbox = [...win.document.querySelectorAll('#ss-options input')]
            .find((input) => input.dataset.key === 'controls');
          checkbox.checked = false;
          checkbox.dispatchEvent(new win.Event('change'));
          await waitUntil(() => {
            const l = win.document.getElementById('ss-link')?.value || '';
            return l.includes('controls=0');
          }, 15000, 'link includes controls=0');
          const link = win.document.getElementById('ss-link').value;
          if (!link.includes('controls=0')) throw new Error('liên kết thiếu controls=0');
          await waitUntil(() => {
            const f = win.document.querySelector('#ss-preview iframe');
            const href = f?.contentWindow?.location?.href || '';
            return Boolean(f?.src?.includes('controls=0') && href.includes('controls=0') && f.contentWindow?.studioEmbed?.ready && f.contentWindow.studioEmbed.controls?.enabled === false);
          }, 30000, 'preview ready with controls=0');
          const frame = win.document.querySelector('#ss-preview iframe');
          if (frame.contentWindow.studioEmbed.controls.enabled !== false) {
            throw new Error('preview chưa áp controls=0');
          }
          dialog.close();
          return 'controls=0 áp dụng cho cả link và preview';
        },
      },
      {
        name: 'Exporter: getter và PNG dùng camera hiện tại sau đổi projection',
        async run(win) {
          await reset(win);
          const engine = win.engine;
          const exporter = win.app.exporter;
          const original = exporter.exportProjectJSON({ download: false });
          const renderer = engine.renderer;
          const render = renderer.render;
          try {
            if (exporter._engine !== engine) throw new Error('constructor không bind engine');
            if (engine.camera.isOrthographicCamera) engine.toggleProjection();
            const perspective = engine.camera;
            const explicit = new win.StudioExporter({ scene: engine.scene, camera: perspective, renderer });
            for (const type of ['OrthographicCamera', 'PerspectiveCamera']) {
              engine.toggleProjection();
              const camera = engine.camera;
              if (camera.type !== type || exporter.camera !== camera) throw new Error(`getter bị cache: ${type}`);
              if (explicit.camera !== perspective) throw new Error('options camera không được giữ nguyên');
              const rendered = [];
              renderer.render = function (scene, view) {
                if (scene === engine.scene) rendered.push(view);
                return render.apply(this, arguments);
              };
              const png = await exporter.captureRenderPNG({ scale: 1, download: false });
              renderer.render = render;

          } finally {
            runtime.stop();
            sm.rootContainer.remove(helper);
          }
        },
      },
      {
        name: 'Copilot Worker: giữ camera và từ chối giao dịch khi cảnh thay đổi giữa chừng',
        async run(win) {
          await reset(win);
          const sm = win.sceneManager;
          const camera = win.engine.camera;
          const controls = win.engine.controls;
          const originalPosition = camera.position.clone();
          const originalQuaternion = camera.quaternion.clone();
          const originalTarget = controls.target.clone();
          const originalZoom = camera.zoom;
          const runtime = await createCopilotRuntime(win);
          try {
            camera.position.set(9, 6, 12);
            controls.target.set(0, 1, 0);
            controls.update();
            const before = camera.position.toArray();
            const result = await runtime.execute(`
              studio.addCube({ name: 'CameraSafeBox' });
              camera.position.set(99, 99, 99);
              return camera.position.toArray();
            `);
            if (result.value.some((value, i) => Math.abs(value - 99) > 1e-6)) throw new Error('Camera mirror không chạy code trong Worker');
            if (camera.position.toArray().some((value, i) => Math.abs(value - before[i]) > 1e-6)) throw new Error('Copilot làm thay đổi camera live');
            const countBefore = sm.getAllObjects().length;
            let markStarted;
            const started = new Promise((resolve) => { markStarted = resolve; });
            const pending = runtime.execute(`
              print('conflict-started');
              await new Promise((resolve) => setTimeout(resolve, 350));
              studio.addCube({ name: 'ConflictBox' });
            `, { timeout: 5000, onLog: markStarted });
            await started;
            camera.position.x += 2;
            controls.update();
            let conflict = null;
            try { await pending; } catch (error) { conflict = error; }
            if (conflict?.code !== 'E_TX_CONFLICT') throw new Error(`Không từ chối conflict đúng cách: ${conflict?.code || 'không lỗi'}`);
            if (sm.findObjectByName('ConflictBox')) throw new Error('Conflict vẫn áp dụng object vào scene');
            if (sm.getAllObjects().length !== countBefore) throw new Error('Conflict làm thay đổi số object live');
            let projectionStarted;
            const projectionExecutionStarted = new Promise((resolve) => { projectionStarted = resolve; });
            const projectionPending = runtime.execute(`
              print('projection-conflict-started');
              await new Promise((resolve) => setTimeout(resolve, 350));
              studio.addCube({ name: 'ProjectionConflictBox' });
            `, { timeout: 5000, onLog: projectionStarted });
            await projectionExecutionStarted;
            controls.target.x += 1;
            controls.update();
            camera.zoom = originalZoom * 2;
            camera.updateProjectionMatrix();
            let projectionConflict = null;
            try { await projectionPending; } catch (error) { projectionConflict = error; }
            if (projectionConflict?.code !== 'E_TX_CONFLICT') throw new Error(`Không từ chối conflict zoom/target: ${projectionConflict?.code || 'không lỗi'}`);
            if (sm.findObjectByName('ProjectionConflictBox')) throw new Error('Conflict zoom/target vẫn áp dụng object');
            return 'camera mirror isolated · position/zoom/target conflict · scene không đổi';
          } finally {
            runtime.stop();
            camera.position.copy(originalPosition);
            camera.quaternion.copy(originalQuaternion);
            camera.zoom = originalZoom;
            camera.updateProjectionMatrix();
            controls.target.copy(originalTarget);
            controls.update();
          }
        },
      },
      {
        name: 'Copilot Worker: animation chạy, dừng và lượt chạy mới không để callback cũ',
        async run(win) {
          await reset(win);
          const sm = win.sceneManager;
          const runtime = await createCopilotRuntime(win);
          try {
            const first = await runtime.execute(`
              scene.clear();
              const box = studio.addCube({ name: 'AnimatedBox' });
              studio.animate(box, (time) => { box.position.x = time; });
              return box.uuid;
            `);
            if (!first.hasAnimations) throw new Error('Runtime không nhận diện animation callback');
            first.resume();
            await sleep(160);
            const box = sm.findObjectByName('AnimatedBox');
            if (!box || box.position.x <= 0.03) throw new Error(`Animation không cập nhật object live (x=${box?.position.x})`);
            first.stop();
            const stoppedX = box.position.x;
            await sleep(120);
            if (Math.abs(box.position.x - stoppedX) > 1e-6) throw new Error('Animation vẫn chạy sau stop');
            const second = await runtime.execute("studio.addCube({ name: 'StaticAfterAnimation' });");
            await sleep(120);
            if (second.hasAnimations) throw new Error('Lượt chạy mới kế thừa animation cũ');
            if (!sm.findObjectByName('StaticAfterAnimation')) throw new Error('Lượt chạy mới không tạo object');
            if (Math.abs(box.position.x - stoppedX) > 1e-6) throw new Error('Callback cũ chạy lại sau lượt chạy mới');
            return `x=${stoppedX.toFixed(3)} · stop OK · new execution clean`;
          } finally {
            runtime.stop();
          }
        },
      },
      {
        name: 'Copilot Worker: dispatch live modifier và thay id pending bằng id thật',
        async run(win) {
          await reset(win);
          const sm = win.sceneManager;
          const mesh = win.studio.addCube({ name: 'ModifierLiveBox', widthSegments: 2, heightSegments: 2, depthSegments: 2 });
          const runtime = await createCopilotRuntime(win);
          try {
            const undoBefore = sm.undoStack.length;
            const result = await runtime.execute(`
              const target = sceneManager.getObjectByName('ModifierLiveBox');
              const modifier = Modifiers.applyModifier(target, 'bevel', { amount: 0.1, segments: 2 });
              Modifiers.updateModifier(target, modifier.id, { amount: 0.25 });
              return { id: modifier.id };
            `);
            const stack = mesh.userData.modifierStack || [];
            if (stack.length !== 1) throw new Error(`Live modifier không tạo stack hợp lệ (${stack.length})`);
            if (stack[0].id !== result.value.id || stack[0].id === 'pending') throw new Error('Pending modifier id không được thay bằng id thật');
            if (Math.abs(stack[0].params.amount - 0.25) > 1e-6) throw new Error(`Live update modifier không áp dụng params: amount=${stack[0].params.amount}; value=${JSON.stringify(result.value)}`);
            if (result.commandResults.length !== 2) throw new Error('Không dispatch đúng hai lệnh live');
            if (sm.undoStack.length !== undoBefore + 1) throw new Error('Hai live modifier không gộp thành một bước undo');
            sm.undo();
            await frames(win, 2);
            if ((mesh.userData.modifierStack || []).length) throw new Error('Undo không xoá modifier stack');
            sm.redo();
            await frames(win, 2);
            if ((mesh.userData.modifierStack || []).length !== 1) throw new Error('Redo không khôi phục modifier stack');
            return `${stack[0].type} ${stack[0].id} · amount=${stack[0].params.amount} · 1 undo`;
          } finally {
            runtime.stop();
          }
        },
      },
      {
        name: 'Copilot Worker: dispatch live Edit Mode, chọn mặt và extrude',
        async run(win) {
          await reset(win);
          const mesh = win.studio.addCube({ name: 'EditLiveBox' });
          const beforeVertices = mesh.geometry.attributes.position.count;
          const runtime = await createCopilotRuntime(win);
          try {
            const result = await runtime.execute(`
              const target = sceneManager.getObjectByName('EditLiveBox');
              editMode.enter(target);
              editMode.setMode('face');
              editMode.selectFace(0);
              const extruded = editMode.extrude(0.18);
              editMode.exit();
              return { extruded };
            `);
            if (result.value.extruded !== true) throw new Error('Worker không nhận kết quả extrude');
            if (win.editMode.isActive) throw new Error('Edit Mode vẫn active sau lệnh exit');
            if (mesh.geometry.attributes.position.count <= beforeVertices) throw new Error('Extrude live không thay đổi topology');
            return `${beforeVertices} → ${mesh.geometry.attributes.position.count} vertices · exit OK`;
          } finally {
            if (win.editMode.isActive) win.editMode.exit();
            runtime.stop();
          }
        },
      },
      {
        name: 'Copilot Worker: adopt GLB thật giữ skeleton, texture, clip và undo-redo',
        async run(win) {
          await reset(win);
          const sm = win.sceneManager;
          const runtime = await createCopilotRuntime(win);
          try {
            const undoBefore = sm.undoStack.length;
            const execution = await runtime.execute("studio.loadGLTF('/models/Soldier.glb', { name: 'CopilotSoldier', x: 3, y: 0, z: 0 });");
            await frames(win, 2);
            const root = sm.findObjectByName('CopilotSoldier');
            if (!root || root.position.x !== 3) throw new Error(`Không adopt được root GLB: ${JSON.stringify({ objects: describeTrackedObjects(sm), newObjects: execution.newObjects.map((object) => ({ name: object.name, type: object.type, uuid: object.uuid })) })}`);
            const skinned = [];
            const textures = new Set();
            root.traverse((object) => {
              if (object.isSkinnedMesh && object.skeleton?.bones?.length) skinned.push(object);
              const materials = Array.isArray(object.material) ? object.material : [object.material];
              for (const material of materials) {
                for (const value of Object.values(material || {})) if (value?.isTexture) textures.add(value);
              }
            });
            if (!skinned.length) throw new Error('GLB mất SkinnedMesh/skeleton sau khi qua Worker');
            if (textures.size < 2) throw new Error(`GLB mất texture (${textures.size})`);
            if (!root.animations?.length) throw new Error('GLB mất AnimationClip');
            if (sm.undoStack.length !== undoBefore + 1) throw new Error('Asset adoption không tạo đúng một bước undo');
            sm.undo();
            await frames(win, 2);
            if (sm.findObjectByName('CopilotSoldier')) throw new Error('Undo không xoá asset root');
            sm.redo();
            await frames(win, 2);
            const restored = sm.findObjectByName('CopilotSoldier');
            if (restored !== root || !root.animations?.length || textures.size < 2) throw new Error('Redo không khôi phục asset nguyên trạng');
            return `${skinned.length} skinned · ${textures.size} textures · ${root.animations.length} clips · undo/redo OK`;
          } finally {
            runtime.stop();
          }
        },
      },
      {
        name: 'Copilot Worker: GLTF nhiều tài nguyên chỉ tải buffer same-origin',
        async run(win) {
          await reset(win);
          const runtime = await createCopilotRuntime(win);
          const originalFetch = win.fetch;
          const requested = [];
          win.fetch = function (input, init) {
            requested.push(typeof input === 'string' ? input : input?.url || String(input));
            return originalFetch.call(this, input, init);
          };
          try {
            const execution = await runtime.execute("studio.loadGLTF('/assets/animations/UAL_Standard.gltf', { name: 'CopilotUAL' });");
            const root = win.sceneManager.findObjectByName('CopilotUAL');
            if (!root || !root.animations?.length) throw new Error(`Không tải được GLTF animation library: ${JSON.stringify({ objects: describeTrackedObjects(win.sceneManager), newObjects: execution.newObjects.map((object) => ({ name: object.name, type: object.type, uuid: object.uuid })) })}`);
            if (!requested.some((url) => url.includes('UAL_Standard.gltf'))) throw new Error('Không request file GLTF chính');
            if (!requested.some((url) => url.includes('AnimationLibrary_Godot_Standard.bin'))) throw new Error(`Không request buffer GLTF phụ: ${JSON.stringify(requested)}`);
            const foreign = requested.filter((url) => {
              try { return new URL(url, win.location.href).origin !== win.location.origin; } catch { return true; }
            });
            if (foreign.length) throw new Error(`Tài nguyên ngoài origin bị chặn: ${foreign.join(', ')}`);
            return `${root.animations.length} clips · ${requested.length} same-origin requests`;
          } finally {
            win.fetch = originalFetch;
            runtime.stop();
          }
        },
      },
      {
        name: 'Copilot Worker: chặn browser/storage/network capability trong Chromium thật',
        async run(win) {
          await reset(win);
          const runtime = await createCopilotRuntime(win);
          try {
            const result = await runtime.execute(`
              const names = ['fetch', 'XMLHttpRequest', 'WebSocket', 'EventSource', 'Worker', 'SharedWorker',
                'indexedDB', 'caches', 'BroadcastChannel', 'navigator', 'location', 'postMessage', 'close'];
              const denied = {};
              for (const name of names) {
                try { globalThis[name]; denied[name] = false; }
                catch (error) { denied[name] = error.code === 'E_PERMISSION'; }
              }
              return { denied, dom: document.createElement('img'), rendererDOM: renderer.domElement };
            `);
            const allowed = Object.entries(result.value.denied).filter(([, ok]) => !ok).map(([name]) => name);
            if (allowed.length) throw new Error(`Capability chưa bị chặn: ${allowed.join(', ')}`);
            if (result.value.dom !== null || result.value.rendererDOM !== null) throw new Error('Worker còn đường truy cập DOM/renderer thật');
            let importError = null;
            try { await runtime.execute("await import('./should-not-load.js');"); } catch (error) { importError = error; }
            if (importError?.code !== 'E_PERMISSION') throw new Error(`Dynamic import không bị chặn: ${importError?.code || 'không lỗi'}`);
            return `${Object.keys(result.value.denied).length} capabilities denied · DOM null · import denied`;
          } finally {
            runtime.stop();
          }
        },
      },
      {
        name: 'Inspector: metadata Curve/Text độc hại hiển thị như dữ liệu, không phải HTML',
        async run(win) {
          await reset(win);
          const payload = '1" autofocus onfocus="window.__curveXss=1"><img src=x onerror="window.__curveXss=2">';
          const cube = win.studio.addCube({ name: 'InspectorXssCurve' });
          cube.userData.curveData = { kind: 'text', text: payload, depth: payload, size: payload };
          win.__curveXss = 0;
          try {
            win.sceneManager.select(cube);
            win.document.querySelector('.prop-tab-btn[data-tab="object"]')?.click();
            win.inspector.render();
            await sleep(80);
            const input = win.document.getElementById('curv-text-val');
            if (!input || input.value !== payload) throw new Error('Inspector không giữ nguyên giá trị text như dữ liệu');
            if (win.document.querySelector('#inspector-container [onerror], #inspector-container [onfocus]')) throw new Error('Metadata tạo thuộc tính event handler');
            if (win.document.querySelector('#inspector-container img[src="x"]')) throw new Error('Metadata tạo thẻ img');
            if (win.__curveXss !== 0) throw new Error('Payload metadata đã được thực thi');
            return 'text/value inert · 0 event handler · 0 execution';
          } finally {
            delete win.__curveXss;
          }
        },
      },
    ];

    // ------------------------------------------------------------------
    // Runner
    // ------------------------------------------------------------------
    async function runSuite() {
      resultsEl.innerHTML = '';
      results.length = 0;
      summaryEl.textContent = 'Đang chạy…';
      summaryEl.className = '';
      let win;
      try {
        win = iframe.contentWindow;
        await waitForStudio(win);
      } catch (error) {
        summaryEl.textContent = 'Không tải được studio: ' + error.message;
        summaryEl.className = 'fail';
        return { error: error.message, results: [] };
      }

      for (const test of tests) {
        const item = addItem(test.name);
        try {
          const detail = await test.run(win);
          finishItem(item, true, detail || '');
          results.push({ name: test.name, ok: true, detail: detail || '' });
        } catch (error) {
          finishItem(item, false, error && error.stack ? error.stack.split('\n')[0] : String(error));
          results.push({ name: test.name, ok: false, detail: error?.stack || String(error) });
        }
      }

      const passed = results.filter((r) => r.ok).length;
      const failed = results.length - passed;
      summaryEl.textContent = `${passed}/${results.length} pass` + (failed ? ` • ${failed} fail` : '');
      summaryEl.className = failed ? 'fail' : 'pass';
      const payload = { passed, failed, total: results.length, results, at: new Date().toISOString() };
      window.__SUITE_RESULTS__ = payload;
      console.log('[BrowserSuite]', payload);
      return payload;
    }

    window.runBrowserSuite = runSuite;
    iframe.addEventListener('load', () => {
      // Give the studio a moment to boot its async subsystems.
      setTimeout(() => { runSuite(); }, 300);
    }, { once: false });
  </script>
